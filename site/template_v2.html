<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swipe 2027 · les mesures des candidats</title>
<meta name="description" content="Ce que proposent les candidats à la présidentielle 2027, mesure par mesure : pourquoi c'est défendu, pourquoi c'est critiqué, avec les sources.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f7; --card:#ffffff; --soft:#f1efeb; --ink:#141414; --ink2:#3a3a3a; --muted:#6e6b66; --line:#e6e3de;
  --accent:#3b4cca; --accent-soft:#eceefb; --pro:#1e7a4c; --pro-soft:#e7f4ec; --con:#b8402f; --con-soft:#fbecea; --ia:#94600a; --ia-soft:#fff4de;
  --serif:"Newsreader",Georgia,serif; --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --nav:60px; --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 36px)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--pad)}

/* barre du haut */
.top{position:sticky;top:0;z-index:20;background:rgba(250,249,247,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.top.sc{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:54px}
.back{width:38px;height:38px;margin-left:-8px;border-radius:50%;display:grid;place-items:center;flex:none}
.back:active{background:var(--soft)}
.top h1{font-size:16px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}

/* recherche */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px;margin:6px 0 4px}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;min-width:0;color:var(--ink)}
.search input::placeholder{color:#9a968f}
.search svg{flex:none;color:var(--muted)}
.clear{color:var(--muted);font-size:13px;font-weight:600;padding:6px}

/* sections */
.sec{margin:22px 0 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-h h2{font-size:13px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sec-h a,.sec-h button{font-size:14px;font-weight:600;color:var(--accent)}
.lead{font-size:15px;color:var(--ink2);margin:4px 0 0}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}

/* lignes de mesure */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:block;padding:13px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--soft)}
.who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:3px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.row .t{font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.meta:empty{display:none}
.tag{font-size:12px;font-weight:600;line-height:1;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.tag.con{background:var(--con-soft);color:var(--con)}
.tag.ia{background:var(--ia-soft);color:var(--ia)}
.tag.ok{background:var(--pro-soft);color:var(--pro)}
.more.sm{padding:4px 14px 12px;border-top:0;font-size:13.5px;margin-top:-6px}
.more{display:block;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line);font-size:14px;font-weight:600;color:var(--accent)}

/* tuiles sujets */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.tile:active{background:var(--soft)}
.tile b{font-size:15px;line-height:1.25;font-weight:600}
.tile span{font-size:12.5px;color:var(--muted);margin-top:6px}

/* tuiles de sujets */
.sqs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sq{border-radius:14px;padding:11px 12px 12px;display:flex;flex-direction:column;gap:3px;min-height:76px}
.sq:active{filter:brightness(.96)}
.sq b{font-size:14.5px;line-height:1.2;font-weight:700}
.sq span{font-size:12px;line-height:1.3;opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sq em{font-style:normal;font-size:11.5px;font-weight:700;margin-top:auto;padding-top:6px;opacity:.9}
/* grille de candidats */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:2px}
.cc:active{background:var(--soft)}
.cc b{font-size:15px;line-height:1.25}
.cc span{font-size:12.5px;color:var(--muted);line-height:1.3}
.cgrid{gap:8px}
.cmini{display:flex;flex-wrap:wrap;gap:8px}
.cmini a{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
/* raccourcis accueil */
.quick{display:flex;gap:8px;margin-top:10px}
.quick a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.quick a:active{background:var(--soft)}
.quick a.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.a a{color:var(--accent);text-decoration:underline}
.msg.err{background:var(--ia-soft);color:var(--ia);border-color:transparent}
.typing{align-self:flex-start;color:var(--muted);font-size:14px}
.composer{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));z-index:29;max-width:616px;margin:0 auto;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 16px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.composer input{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:none;min-width:0}
.composer button{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.composer button:disabled{opacity:.35}
body.chat-on{padding-bottom:calc(var(--nav) + 100px)}
.ctx{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.ctx b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:2px}
/* candidats */
.cands{display:flex;flex-direction:column}
.cand{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.cand:first-child{border-top:0}
.cand:active{background:var(--soft)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.cand .n{flex:1;min-width:0}
.cand .n b{display:block;font-size:15px;font-weight:600}
.cand .n span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#b5b1aa;flex:none}

/* défilement horizontal */
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--pad));padding:2px var(--pad) 4px}
.hs::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.avs{gap:4px}.avs a{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink2);text-align:center}
.avs .av{width:46px;height:46px;font-size:15px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip small{font-weight:500;opacity:.7}

/* blocs de candidat dans un sujet */
.cblock{margin-top:10px}
.cblock .list .row:first-child{border-top:0}
.ch{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-size:14px;font-weight:700}
.cblock[id^="pt-"] .ch{display:block;font-size:15px;line-height:1.3}
.ch a{display:flex;align-items:center;gap:8px}
.ch .c{font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
.absent{font-size:14px;color:var(--ink2);background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;margin-top:18px}
.absent b{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}

/* page mesure */
.m-top{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.m-top a{font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.m-q{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.28;letter-spacing:-.005em;margin:0}
.m-sous{margin:10px 0 0;padding-left:18px;font-size:14px;color:var(--ink2)}
.m-sous li{margin:3px 0}
.brief{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:16px}
.brief h3{font-size:12px;font-weight:700;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.brief p{margin:0;font-size:15.5px;line-height:1.5}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.fact b{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}
.fact span{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
a.fact{display:block}a.fact:active{background:var(--soft)}
.fact.wide{grid-column:1/-1}
.pc{display:grid;gap:8px;margin-top:10px}
.pc a{display:block;border-radius:12px;padding:10px 12px}
.pc .p{background:var(--pro-soft)}
.pc .c{background:var(--con-soft)}
.pc b{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.pc .p b{color:var(--pro)} .pc .c b{color:var(--con)}
.pc span{font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;color:var(--ia);background:var(--ia-soft);border-radius:12px;padding:9px 12px;margin-top:10px}

/* volets dépliables */
.acc{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details{border-top:1px solid var(--line)}
details:first-child{border-top:0}
summary{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:14px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .s{flex:1;min-width:0}
summary b{display:block;font-size:15.5px;font-weight:600}
summary span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
summary .cnt{font-size:12px;font-weight:700;background:var(--soft);border-radius:999px;padding:3px 8px;margin-left:6px;color:var(--ink2);vertical-align:1px}
summary svg{flex:none;margin-top:3px;color:#a8a49d;transition:transform .2s}
details[open] summary svg{transform:rotate(180deg)}
details[open] summary span{display:none}
.body{padding:0 14px 16px;font-size:15px;line-height:1.55;color:var(--ink2)}
.body p{margin:0 0 10px}
.body ul{margin:0;padding-left:18px}
.body li{margin:0 0 8px}
.q{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:0 0 14px}
.q.c{border-left-color:#e4a79e}
.q.p{border-left-color:#9fd1b4}
.q .h{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px}
.q .h i{font-style:normal;font-weight:500;color:var(--muted)}
.q .x{font-size:15px}
.src{display:inline-block;font-size:12.5px;color:var(--accent);font-weight:600;margin-top:3px;word-break:break-word}
.camps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.sim{display:block;padding:10px 0;border-top:1px solid var(--line)}
.sim:first-of-type{border-top:0}
.sim .who{margin-bottom:2px}
.sim .x{font-size:14.5px;color:var(--ink)}
.sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 4px}

/* en-tête fiche / candidat */
.tn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .dot{width:11px;height:11px}
.heart{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink2)}
.heart.on{color:#e0344f}
.heart:active{background:var(--soft)}
.m-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.m-tags a{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.mini-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini-actions .btn{height:42px;font-size:14px;gap:6px}
/* approfondir : onglets qui glissent de gauche à droite */
.dive-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 8px}
.dive-h h2{font-size:13px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dive-h span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--pad));padding:2px var(--pad) 10px;position:sticky;top:54px;z-index:10;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{font-size:13.5px;padding:7px 12px}
.swiper{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1*var(--pad));padding:0 var(--pad);scroll-padding:0 var(--pad);transition:height .2s}
.swiper::-webkit-scrollbar{display:none}
.swiper.drag{user-select:none}
.panel{flex:0 0 100%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.panel .body{padding:14px 14px 16px}
.panel h3{font-size:16px;margin:0 0 10px}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .2s}
.dots i.on{background:var(--ink);width:16px;border-radius:3px}
/* page candidat */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.1;font-weight:700}
.stat span{font-size:12px;color:var(--muted);line-height:1.25;display:block;margin-top:2px}
button.stat{text-align:left}
button.stat.on{border-color:var(--ink);background:var(--soft)}
/* actions */
.actions{display:grid;gap:8px;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;font-weight:600;font-size:15px;background:var(--card);border:1px solid var(--line)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:active{opacity:.8}

/* feuille de signalement */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:18px 18px 0 0;padding:10px var(--pad) calc(16px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}.sheet-bg.on{display:block}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;font-size:14px;font-weight:600}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.opt.on{border-color:var(--ink);background:var(--soft)}
textarea,.sheet input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;margin-top:10px;background:var(--bg)}
textarea{min-height:84px;resize:vertical}
.sent{font-size:14px;margin-top:10px}

/* navigation du bas */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;max-width:520px;margin:0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(0,0,0,.06);border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.06)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav);padding:0 6px;max-width:none}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:#8d8982;border-radius:999px;margin:6px 2px}
.nav a.on{color:var(--ink);background:var(--soft)}
.nav a.mid{color:#fff;background:var(--ink);margin:6px 4px}
.nav a.mid.on{background:var(--ink);color:#fff}
/* parcours guidé (mode « stories ») */
body.story-on{padding-bottom:0}
body.story-on .nav, body.story-on .top{display:none}
.story{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;max-width:640px;margin:0 auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.st-bar{display:flex;gap:3px;padding:calc(10px + env(safe-area-inset-top)) var(--pad) 0}
.st-bar i{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.st-bar i b{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform .25s}
.st-head{display:flex;align-items:center;gap:8px;padding:10px var(--pad) 6px}
.st-head .lab{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-ico{height:34px;min-width:34px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.st-ico.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.st-body{flex:1;min-height:0;padding:6px var(--pad) 0;display:flex}
.st-card{flex:1;min-height:0;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;animation:stin .22s ease-out}
.st-card.back{animation-name:stback}
@keyframes stin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes stback{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.st-kick{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.st-q{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.2;margin:0}
.st-m{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.3;margin:0}
.st-who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.st-who .av{width:40px;height:40px;font-size:14px}
.st-who small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.st-blind{display:flex;align-items:center;gap:10px}
.st-blind .av{background:#9a968f}
.st-p{font-size:15px;line-height:1.5;color:var(--ink2);margin:0}
.st-avs{display:flex;flex-wrap:wrap;gap:6px}
.st-avs .av{width:34px;height:34px;font-size:12px}
.st-foot{display:flex;gap:8px;align-items:center;padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom))}
.st-foot .btn{flex:1;height:48px}
.st-foot .nb{flex:none;width:48px;padding:0}
.st-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:auto}
.st-rc{display:block;padding:10px 0;border-top:1px solid var(--line)}
.st-rc:first-of-type{border-top:0}
.st-rc .x{font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.path-card{display:block;background:var(--ink);color:#fff;border-radius:var(--r);padding:16px;margin-top:16px}
.path-card b{display:block;font-size:17px;margin-bottom:3px}
.path-card span{display:block;font-size:14px;opacity:.8}
.path-card .go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#fff;color:var(--ink);font-weight:700;font-size:14px;border-radius:999px;padding:8px 14px}
.empty{text-align:center;color:var(--muted);font-size:15px;padding:30px 10px}
.foot{font-size:12.5px;color:var(--muted);margin:26px 0 0;line-height:1.5}
.foot a{text-decoration:underline}
</style>
</head>
<body>
<header class="top" id="top"><div class="wrap" id="top-in"></div></header>
<main class="wrap" id="app"></main>
<nav class="nav"><div class="wrap">
  <a href="#/" data-n="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</a>
  <a href="#/sujets" data-n="sujets"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Sujets</a>
  <a href="#/swipe" data-n="swipe" class="mid"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="17" rx="2.5"/><path d="M3 7v10M21 7v10"/></svg>Swipe</a>
  <a href="#/candidats" data-n="candidats"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.4.2 4 1.8 4.6 4.5"/></svg>Candidats</a>

</div></nav>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"></div>

<script>
const DATA=/*__DATA__*/null;
const API="/api";
const C=DATA.cands, TH=DATA.themes, M=DATA.mes, F=DATA.fiches;
const THM=Object.fromEntries(TH.map(t=>[t.id,t]));
const PT={}; TH.forEach(t=>(t.pts||[]).forEach(([id,tt])=>PT[id]={id,t:tt,th:t.id}));   // points précis d'un sujet (« Âge de départ »…)
// Une couleur douce par sujet (fond, texte).
const TCOL={salaires:["#fdf0d5","#8a5a00"],retraites:["#e8eefc","#2f4a9e"],impots:["#efe9fb","#5b3b9e"],travail:["#fde8e1","#a3412a"],economie:["#e6f0f7","#1f5a80"],agriculture:["#eef5df","#4d6b16"],ecologie:["#e2f4ea","#1e7a4c"],sante:["#fbe6ec","#a3264f"],ecole:["#fff3d6","#86620a"],logement:["#f3ece4","#7a5530"],securite:["#e9ecf1","#2e3a4f"],immigration:["#e4f3f3","#1b6b6b"],institutions:["#f1e8f3","#7a2f80"],europe:["#e6eefb","#1d4fa3"],societe:["#fceee3","#9a4d17"]};
const tile=(t,desc,note)=>{ const [bg,ink]=TCOL[t.id]||["#f1efeb","#141414"]; return `<a class="sq" href="#/s/${t.id}" style="background:${bg};color:${ink}"><b>${esc(t.t)}</b>${desc?`<span>${esc(t.d)}</span>`:""}${note?`<em>${esc(note)}</em>`:""}</a>`; };
const realPt=m=>m.pt&&!/-autres$/.test(m.pt)?m.pt:null;
const MID=Object.fromEntries(M.map(m=>[m.id,m]));
// Candidats proposés : pas les candidats retirés. Ordre alphabétique du nom de famille (neutre).
const lastName=n=>{ const w=n.replace(/\s*\(.*\)$/,"").split(" "); return /^(le|la|de|du)$/i.test(w[w.length-2]||"")?w.slice(-2).join(" "):w[w.length-1]; };
const CK=Object.keys(C).filter(k=>!C[k].retrait).sort((a,b)=>lastName(C[a].cand).localeCompare(lastName(C[b].cand),"fr"));
const CMAIN=CK.filter(P=>C[P].main), COTHER=CK.filter(P=>!C[P].main);   // principaux d'abord (liste dans build_v2.py), ordre alphabétique dans chaque groupe
const LIVE=new Set(CK);
const ML=M.filter(m=>LIVE.has(m.P));

const $=s=>document.querySelector(s);
/* Mesures comparables : mots partagés, pondérés par leur rareté (les mots rares comptent plus). */
const STOP=new Set("avec dans pour plus sans sont leur leurs cette ceux celle tous toutes tout faire mettre mise place etat national nationale france francais francaise public publique publics publiques notamment aussi entre afin ainsi dont sous etre avoir doit peut chaque autres autre contre depuis vers mesure mesures plan politique creer renforcer garantir developper permettre instaurer assurer lutter".split(" "));
const toksOf=s=>[...new Set(norm(s).split(/[^a-z0-9]+/).filter(w=>w.length>3&&!STOP.has(w)).map(w=>w.replace(/(s|x)$/,"")))];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g," ");
const initials=n=>n.replace(/\s*\(.*\)$/,"").split(/[\s-]+/).filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const firstSentence=s=>{ s=String(s||"").trim(); const m=s.match(/^(.{40,220}?[.!?…])\s/); return m?m[1]:s.slice(0,200)+(s.length>200?"…":""); };
const host=u=>{ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return "source"; } };
const plural=(n,a,b)=>n+" "+(n>1?b:a);
const ICO={
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chev:'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  down:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  flag:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-1.5 4L16 12H5"/></svg>',
};

const TK=new Map(ML.map(m=>[m.id,toksOf(m.t+" "+m.sous.join(" "))]));
const DF={}; for(const ts of TK.values()) for(const w of ts) DF[w]=(DF[w]||0)+1;
const IDF=w=>Math.log(ML.length/(DF[w]||1));
function simScore(a,b){ const A=new Set(TK.get(a.id)||[]); let s=0,n=0; for(const w of TK.get(b.id)||[]) if(A.has(w)){ s+=IDF(w); n++; } if(a.th===b.th) return n?s+2:0; return n>=2&&s>=9?s:0; }
// Pour chaque autre candidat : sa mesure la plus proche (même point), sinon rien.
function comparables(m){
  const same=[], seen=new Set([m.P]), pt=realPt(m);
  if(pt) for(const P of CK){ if(seen.has(P)) continue; const l=ML.filter(x=>x.P===P&&x.pt===pt); if(!l.length) continue;
    let best=l[0],bs=-1; for(const x of l){ const sc=simScore(m,x)+rank(x)/1e4; if(sc>bs){ bs=sc; best=x; } } same.push(best); seen.add(P); }
  const near=[];
  if(same.length<3) for(const P of CK){ if(seen.has(P)) continue; let best=null,bs=0;   // rapprochement par mots seulement si le point compte peu de candidats
    for(const x of ML){ if(x.P!==P) continue; const sc=simScore(m,x); if(sc>bs){ bs=sc; best=x; } }
    if(best&&bs>=(pt?10:6)) near.push([bs,best]); }
  const out=same.concat(near.sort((a,b)=>b[0]-a[0]).map(x=>x[1])); out.same=same.length; return out; }

/* ---------- mesure des parcours ----------
   Uniquement des compteurs agrégés : transitions « écran → écran » et événements (début/fin de parcours…).
   Aucun identifiant, aucun cookie, rien d'enregistré sur le téléphone. Envoyé à /api/flux quand la page se ferme. */
const FX={t:{},e:{},vide:""}; let LASTV=null;
const track=e=>{ FX.e[e]=(FX.e[e]||0)+1; };
function trackView(v){ if(LASTV===v) return; if(LASTV){ const k=LASTV+">"+v; FX.t[k]=(FX.t[k]||0)+1; } else track("entree:"+v); LASTV=v; }
function flush(){ if(FX.vide){ track("recherche-vide:"+FX.vide); FX.vide=""; }
  if(!Object.keys(FX.t).length&&!Object.keys(FX.e).length) return;
  const body=JSON.stringify({t:FX.t,e:FX.e}); FX.t={}; FX.e={};
  try{ if(!navigator.sendBeacon||!navigator.sendBeacon(API+"/flux",new Blob([body],{type:"application/json"}))) fetch(API+"/flux",{method:"POST",headers:{"Content-Type":"application/json"},body,keepalive:true}).catch(()=>{}); }catch(e){} }
addEventListener("pagehide",flush); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); });

/* ---------- mesures sauvegardées (cœur), gardées seulement sur le téléphone ---------- */
const FAVK="favoris";
const favs=()=>{ try{ return JSON.parse(localStorage.getItem(FAVK))||[]; }catch(e){ return []; } };
const isFav=id=>favs().includes(id);
function toggleFav(id){ const f=favs(), i=f.indexOf(id); if(i>=0) f.splice(i,1); else f.unshift(id); try{ localStorage.setItem(FAVK,JSON.stringify(f)); }catch(e){} track(i>=0?"favori:retire":"favori:ajoute"); return i<0; }
const HEART=on=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="${on?"currentColor":"none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.2-8.6C1.3 8.4 3 5 6.4 5c2 0 3.3 1.1 4.1 2.3h3c.8-1.2 2.1-2.3 4.1-2.3C21 5 22.7 8.4 21.2 11.4 19 15.6 12 20 12 20z"/></svg>`;

/* ---------- petits blocs ---------- */
const who=P=>`<span class="who"><i class="dot" style="background:${C[P].color}"></i>${esc(C[P].cand)}</span>`;
const ficheOf=id=>F[id]||REMOTE[id]||null;
function tagsOf(m){
  const f=ficheOf(m.id), out=[];
  if(f){ const n=(f.critiques||[]).length; if(n) out.push(`<span class="tag con">${plural(n,"critique","critiques")}</span>`);
    if(!f.genere) out.push(`<span class="tag ok">Fiche vérifiée</span>`); }
  else if(m.cle) out.push(`<span class="tag">Mesure clé</span>`);
  return `<div class="meta">${out.join("")}</div>`;
}
const row=(m,showWho=true)=>`<a class="row" href="#/m/${encodeURIComponent(m.id)}">${showWho?who(m.P):""}<div class="t">${esc(m.t)}</div>${tagsOf(m)}</a>`;
// Ordre dans une liste : mesures avec fiche (les plus débattues d'abord), puis mesures clés, puis le reste.
const rank=m=>{ const f=F[m.id]; return f?(1000+(f.critiques||[]).length*10+(f.genere?0:5)):(m.cle?100:0); };
const byRank=(a,b)=>rank(b)-rank(a);
function rowsWithMore(list,first,showWho,key){
  const shown=EXP[key]||first;
  let h=`<div class="list">${list.slice(0,shown).map(m=>row(m,showWho)).join("")}`;
  const rem=list.length-shown;
  if(rem>0) h+=`<button class="more" data-more="${esc(key)}" data-step="${first}">${first===1||rem<=20?"Voir "+(rem>1?"les "+rem+" autres":"l'autre"):"Voir 20 de plus ("+rem+" restantes)"}</button>`;
  return h+"</div>";
}
const EXP={};   // listes dépliées, par clé
function candLine(P,sub){ const c=C[P]; return `<a class="cand" href="#/c/${P}"><span class="av" style="background:${c.color}">${initials(c.cand)}</span><span class="n"><b>${esc(c.cand)}</b><span>${esc(sub??c.nom)}</span></span>${ICO.chev}</a>`; }
const status=P=>C[P].complet?"Programme complet publié":"Propositions annoncées";

/* ---------- en-tête ---------- */
function setTop(html){ $("#top-in").innerHTML=html; $("#top").hidden=!html; }
const backTop=title=>setTop(`<button class="back" aria-label="Retour" onclick="goBack()">${ICO.back}</button><h1>${esc(title)}</h1>`);
function goBack(){ if(history.length>1&&HIST>0) history.back(); else location.hash="#/"; }
let HIST=0;

/* ---------- vues ---------- */
function vHome(){
  setTop(`<div class="brand">Swipe 2027<small>Les mesures des candidats, expliquées simplement</small></div>`);
  // Récemment dans la presse : une mesure par candidat, celle dont l'article cité le plus récent est le plus proche d'aujourd'hui.
  const recent=CK.map(P=>ML.filter(m=>m.P===P&&m.dp).sort((a,b)=>b.dp.localeCompare(a.dp))[0]).filter(Boolean).sort((a,b)=>b.dp.localeCompare(a.dp)).slice(0,6);
  const st=LS.get("parcours:"), resume=st&&st.i>0&&!st.done;
  const hot=hotSubjects(6);
  $("#app").innerHTML=`
    <a class="search" href="#/chercher" aria-label="Chercher une mesure">${ICO.search}<input placeholder="Une mesure entendue ? Smic, retraites…" readonly tabindex="-1"></a>
    <div class="quick"><a href="#/swipe">Swipe</a><a class="dark" href="#/parcours">${resume?"Reprendre le parcours":"Parcours découverte"}</a></div>
    ${favs().length?`<section class="sec" style="margin-top:20px"><div class="sec-h"><h2>Mes mesures sauvegardées</h2><a href="#/favoris">Toutes (${favs().length})</a></div>${rowsWithMore(favs().map(id=>MID[id]).filter(Boolean),3,true,"home-fav")}</section>`:""}
    <section class="sec" style="margin-top:20px"><div class="sec-h"><h2>Sujets du moment</h2><a href="#/sujets">Tous les sujets</a></div>
      <div class="sqs">${hot.map(x=>tile(x.t,false,x.note)).join("")}</div></section>
    <section class="sec"><div class="sec-h"><h2>Récemment dans la presse</h2></div>
      <div class="list">${recent.map(m=>row(m,true).replace('<div class="meta">',`<div class="meta"><span class="tag">${esc(dateFr(m.dp))}</span>`)).join("")}</div>
      <p class="hint">D'après la date des articles cités dans nos fiches, une mesure par candidat. Un vrai fil d'actualité viendra ensuite.</p></section>`;
}
/* Sujets du moment. Aujourd'hui : d'après les articles cités dans nos fiches (mesures citées par la presse ces 60 derniers jours).
   Plus tard : aussi ce que les gens consultent (compteurs « vue:sujet:… » envoyés à /api/flux, voir ROADMAP point 8). */
function hotSubjects(n){
  const since=new Date(Date.now()-60*864e5).toISOString().slice(0,10);
  return TH.map(t=>{ const ms=ML.filter(m=>m.th===t.id&&m.dp&&m.dp>=since); const last=ms.map(m=>m.dp).sort().pop();
      return {t,n:ms.length,last,note:ms.length?(ms.length>1?ms.length+" mesures dans la presse":"Dans la presse")+" · "+dateFr(last):""}; })
    .sort((a,b)=>b.n-a.n||String(b.last||"").localeCompare(String(a.last||""))).slice(0,n);
}
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const dateFr=d=>{ const [y,m,j]=d.split("-").map(Number); return j+" "+MOIS[m-1]+(y!==new Date().getFullYear()?" "+y:""); };

function vSujets(){
  setTop("");
  $("#app").innerHTML=`<section class="sec" style="margin-top:calc(14px + env(safe-area-inset-top))"><div class="sec-h"><h2>Les principaux sujets</h2></div>
    <div class="sqs">${TH.map(t=>tile(t,true)).join("")}</div></section>
    <p class="hint">Le classement des mesures a été fait par une IA, puis relu : signalez les erreurs.</p>`;
}

function vSujet(id,focus){
  const t=THM[id]; if(!t) return vNotFound();
  track("vue:sujet:"+id);
  backTop(t.t);
  const ms=ML.filter(m=>m.th===id);
  const has=CK.filter(P=>ms.some(m=>m.P===P)), none=CK.filter(P=>!ms.some(m=>m.P===P));
  const candRow=(l,P,k)=>{ l=l.filter(m=>m.P===P).sort(byRank); let h=row(l[0]);
    if(l.length>1) h+=EXP[k]?l.slice(1).map(m=>row(m)).join(""):`<button class="more sm" data-more="${esc(k)}" data-step="1">+ ${plural(l.length-1,"autre mesure","autres mesures")} de ${esc(lastName(C[P].cand))}</button>`;
    return h; };
  let body;
  if(t.pts){
    // Un bloc par point précis (« Âge de départ »), avec une ligne par candidat : on compare les positions sur la même question.
    const groups=t.pts.map(([pid,pt])=>({pid,pt,l:ms.filter(m=>m.pt===pid)})).filter(g=>g.l.length).map(g=>({...g,cs:CK.filter(P=>g.l.some(m=>m.P===P))}));
    const main=groups.filter(g=>!/-autres$/.test(g.pid)&&g.cs.length>=2).sort((a,b)=>b.cs.length-a.cs.length);
    const rest=groups.filter(g=>!main.includes(g));
    // Aperçu : 3 positions les plus différentes entre elles (pour voir l'éventail du débat) ; « voir tous » remet l'ordre alphabétique.
    const diverse=(g,n)=>{ const best=P=>g.l.filter(m=>m.P===P).sort(byRank)[0];
      const pool=g.cs.map(P=>({P,m:best(P)})); if(pool.length<=n) return g.cs;
      const tk=x=>new Set(TK.get(x.m.id)||[]), jac=(a,b)=>{ const A=tk(a),B=tk(b); let i=0; A.forEach(w=>B.has(w)&&i++); return i/((A.size+B.size-i)||1); };
      const pick=[pool.slice().sort((a,b)=>rank(b.m)-rank(a.m))[0]];
      while(pick.length<n){ let bx=null,bs=2; for(const x of pool){ if(pick.includes(x)) continue; const sc=Math.max(...pick.map(y=>jac(x,y))); if(sc<bs){ bs=sc; bx=x; } } pick.push(bx); }
      return CK.filter(P=>pick.some(x=>x.P===P)); };
    const block=g=>{ const k="pc-"+g.pid, all=!!EXP[k], cs=all?g.cs:diverse(g,3);
      return `<div class="cblock" id="pt-${g.pid}"><div class="ch">${esc(g.pt)} <span class="c">· ${plural(g.cs.length,"candidat","candidats")}</span></div><div class="list">${cs.map(P=>candRow(g.l,P,"pm-"+g.pid+"-"+P)).join("")}${g.cs.length>cs.length?`<button class="more" data-more="${k}" data-step="1">Voir les ${g.cs.length} candidats</button>`:""}</div></div>`; };
    const restRows=rest.flatMap(g=>g.l.sort(byRank));
    body=`${main.length?`<div class="hs" style="margin-top:12px">${main.map(g=>`<a class="chip" href="#" data-jump="${g.pid}">${esc(g.pt.replace(/\s*\(.*\)$/,""))} <small>${g.cs.length}</small></a>`).join("")}</div>`:""}
      ${main.map(block).join("")}

const IDX=ML.map(m=>{ const f=F[m.id]; return {m, a:norm(m.t+" "+m.sous.join(" ")), b:norm(m.sec+" "+C[m.P].cand+" "+C[m.P].nom+" "+THM[m.th].t+" "+(realPt(m)?PT[m.pt].t:"")+" "+(f?f.resume||"":""))}; });
const SYN={retraite:["pension"],smic:["salaire minimum"],immigration:["immigr","etranger"],impot:["impots","fiscal","taxe"],ecole:["educat","eleve"],police:["securite"],climat:["ecolog"],chomage:["emploi"]};
function search(q){
  const toks=norm(q).split(/[^a-z0-9€%]+/).filter(w=>w.length>1);
  if(!toks.length) return [];
  const re=toks.map(w=>new RegExp("(^|[^a-z0-9])("+[w,...(SYN[w.replace(/s$/,"")]||[])].map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")"));
  const out=[];
  for(const x of IDX){ let s=0, ok=true;
    for(const r of re){ const ia=r.test(x.a), ib=r.test(x.b); if(!ia&&!ib){ ok=false; break; } s+=ia?3:1; }
    if(ok) out.push([s*100+rank(x.m)/20,x.m]); }
  return out.sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
}

/* ---------- parcours guidé ----------
   Une étape = un point précis (« Âge de départ »). On fait défiler la position de chaque candidat sur ce point,
   puis un récapitulatif, puis la question suivante. Glisser = « suivant », jamais « j'aime ». */
const ptCands=pid=>CK.filter(P=>ML.some(m=>m.P===P&&m.pt===pid));
function pathSteps(sid){
  const pts=t=>(t.pts||[]).map(p=>p[0]).filter(pid=>!/-autres$/.test(pid));
  if(sid){ const t=THM[sid]; return t?pts(t).filter(pid=>ptCands(pid).length>=2).sort((a,b)=>ptCands(b).length-ptCands(a).length):[]; }
  // Découverte : pour chaque sujet (dans l'ordre), la question sur laquelle le plus de candidats se sont prononcés (au moins 4).
  return TH.map(t=>pts(t).map(pid=>[pid,ptCands(pid).length]).sort((a,b)=>b[1]-a[1])[0]).filter(x=>x&&x[1]>=4).map(x=>x[0]);
}
const LS={ get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
function resumeLabel(){ const s=LS.get("parcours:"); return s&&s.i>0&&!s.done?"Reprendre à la question "+(s.i+1):"Commencer"; }
// Ordre des candidats : mélangé une fois par parcours (personne n'est toujours en premier), puis stable.
function shuffled(arr,seed){ const a=arr.slice(); let x=seed||1; for(let i=a.length-1;i>0;i--){ x=(x*9301+49297)%233280; const j=Math.floor(x/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let ST=null;
function vParcours(sid){
  sid=sid||"";
  const steps=pathSteps(sid||null); if(!steps.length) return vNotFound();
  const key="parcours:"+sid; let saved=LS.get(key);
  if(!ST||ST.sid!==sid){ ST={sid,steps,i:0,j:0,seed:1+Math.floor(Math.random()*9999),blind:false,shown:new Set()};
    if(saved&&!saved.done&&saved.i<steps.length){ Object.assign(ST,{i:saved.i,j:0,seed:saved.seed||ST.seed,blind:!!saved.blind}); }
    track("parcours:debut"+(sid?":"+sid:"")); }
  document.body.classList.add("story-on");
  renderStory(0);
}
// Mode « noms masqués » : on retire aussi le nom du candidat et de son parti du texte des fiches.
function maskName(txt,P,on){ if(!(on??(ST&&ST.blind))) return txt; const c=C[P];
  const names=[c.cand,lastName(c.cand),c.nom,(c.long||"").split(" · ")[0]].filter(x=>x&&x.length>1).sort((a,b)=>b.length-a.length);
  let t=String(txt||""); for(const n of names) t=t.replace(new RegExp("(^|[^\\p{L}])"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?=$|[^\\p{L}])","giu"),"$1[ce candidat]");
  return t; }
function storyCards(pid){
  const cs=shuffled(ptCands(pid),ST.seed+pid.length*31);
  return cs.map(P=>{ const l=ML.filter(m=>m.P===P&&m.pt===pid).sort(byRank); return {P,m:l[0],more:l.length-1}; });
}
function renderStory(dir){

  const isLast=!done&&ST.j===total-1;
  $("#app").innerHTML=`<div class="story" id="story">
    <div class="st-bar">${bar}</div>
    <div class="st-head"><span class="lab">${ST.sid?"Parcours · "+esc(THM[ST.sid].t):"Parcours découverte"}</span>
      ${done?"":`<button class="st-ico${ST.blind?" on":""}" id="st-blind" aria-pressed="${ST.blind}">${ST.blind?"Noms masqués":"Masquer les noms"}</button>`}
      <button class="st-ico" id="st-close" aria-label="Fermer le parcours">✕</button></div>

    ${done?"":`<div class="st-foot"><button class="btn nb" id="st-prev" aria-label="Précédent"${ST.i===0&&ST.j===0?" disabled style=\"opacity:.35\"":""}>←</button><button class="btn dark" id="st-next">${isLast?(ST.i===steps.length-1?"Terminer":"Question suivante"):ST.j===0?"Voir les positions":"Suivant"} →</button></div>`}
  </div>`;
  const go=d=>{ if(done) return; if(d>0){ if(ST.j<total-1) ST.j++; else { ST.i++; ST.j=0; } } else { if(ST.j>0) ST.j--; else if(ST.i>0){ ST.i--; ST.j=storyCards(steps[ST.i]).length+1; } else return; } renderStory(d); };

/* ---------- chat ----------
   Utilise l'API existante (api/chat.js) : mode « general », ou « mesure » quand on vient d'une fiche. Le prompt système reste côté serveur. */
const CHAT={key:null,msgs:[]};
function mdInline(s){ return s.replace(/\[([^\]]{1,140})\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function vChat(mid){
  const m=mid&&MID[mid]; const key=m?"m:"+m.id:"g";
  if(CHAT.key!==key){ CHAT.key=key; CHAT.msgs=[]; }
  document.body.classList.add("chat-on");
  setTop(m?`<button class="back" aria-label="Retour" onclick="goBack()">${ICO.back}</button><h1>Question sur la mesure</h1>`:`<h1 style="font-size:18px">Chat</h1>`);
  const sugg=m?["Qu'est-ce que ça changerait pour moi ?","Combien ça coûte ?","Qui est contre, et pourquoi ?"]
    :["Qui veut revenir à la retraite à 60 ans ?","Quelle différence entre l'ISF et la taxe Zucman ?","Que proposent les candidats sur le nucléaire ?","Comment le Smic est-il fixé ?"];
  const draw=busy=>{ $("#app").innerHTML=`${m?`<div class="ctx"><b>${esc(C[m.P].cand)}</b>${esc(m.t)}</div>`:`<p class="lead" style="margin-top:8px">Posez une question sur les candidats, leurs mesures ou un sujet. Les réponses citent leurs sources.</p>`}
    <div class="chat">${CHAT.msgs.map(x=>`<div class="msg ${x.role==="user"?"u":x.err?"a err":"a"}">${x.role==="user"?esc(x.content):mdInline(esc(x.content))}</div>`).join("")}${busy?`<div class="typing">Recherche en cours…</div>`:""}</div>
    ${!CHAT.msgs.length?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">${sugg.map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>`:""}
    <form class="composer" id="cf"><input id="ci" autocomplete="off" enterkeyhint="send" placeholder="Votre question…"${busy?" disabled":""}><button aria-label="Envoyer"${busy?" disabled":""}>↑</button></form>`;
    document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>send(b.dataset.q));
    $("#cf").onsubmit=e=>{ e.preventDefault(); send($("#ci").value); };
    window.scrollTo(0,document.body.scrollHeight); };
  async function send(q){ q=String(q||"").trim(); if(!q) return;
    CHAT.msgs.push({role:"user",content:q}); track("chat:question"+(m?":mesure":"")); draw(true);
    const payload=m?{mode:"mesure",mesureId:m.id,messages:CHAT.msgs.filter(x=>!x.err)}:{mode:"general",messages:CHAT.msgs.filter(x=>!x.err)};
    let txt, err=false;
    try{ const r=await fetch(API+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(r.status===429){ txt="Vous avez atteint la limite de questions pour aujourd'hui. Revenez demain !"; err=true; }
      else if(!r.ok){ txt="Le chat n'est pas disponible pour le moment"+(r.status===404||r.status===501?" (le serveur n'est pas lancé ici)":"")+"."; err=true; }
      else txt=(await r.json()).text||""; }
    catch(e){ txt="Le chat n'est pas disponible pour le moment (pas de connexion au serveur)."; err=true; }
    CHAT.msgs.push({role:"assistant",content:txt,err}); if(CHAT.key===key&&location.hash.startsWith("#/chat")) draw(false); }
  draw(false);
}
// Au hasard : un candidat tiré au sort (chacun a la même chance), puis une de ses mesures avec fiche.
/* ---------- Swipe ----------
   Un fil de fiches à faire défiler, une carte à la fois. Équilibré : on tourne entre les candidats (ordre tiré au sort),
   chacun donne une de ses mesures à tour de rôle. Glisser = « suivante », jamais « j'aime » ; le cœur sert à sauvegarder. */
let SW=null;
function swipeDeck(){
  const ps=shuffled(CK.filter(P=>ML.some(m=>m.P===P&&F[m.id])),1+Math.floor(Math.random()*9999));
  const per=Object.fromEntries(ps.map(P=>[P,shuffled(ML.filter(m=>m.P===P&&F[m.id]),1+Math.floor(Math.random()*9999))]));
  const deck=[]; let more=true;
  while(more){ more=false; for(const P of ps){ const m=per[P].shift(); if(m){ deck.push(m); more=true; } } }
  return deck;
}
function vSwipe(){
  if(!SW) SW={deck:swipeDeck(),i:0,blind:false,shown:new Set()};
  track("swipe:debut"); document.body.classList.add("story-on"); renderSwipe(0);
}

/* ---------- routeur ---------- */
const POS={};
function route(){
  const h=location.hash.replace(/^#/,"")||"/";
  const [path,qs]=h.split("?"); const p=path.split("/").filter(Boolean).map(decodeURIComponent);
  const nav=p[0]==="swipe"?"swipe":p[0]==="chat"?"chat":p[0]==="sujets"||p[0]==="s"?"sujets":p[0]==="candidats"||p[0]==="c"?"candidats":"home";
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.n===nav));
  closeSheet();
  if(p[0]!=="parcours"&&p[0]!=="swipe") document.body.classList.remove("story-on");
  if(p[0]!=="chat") document.body.classList.remove("chat-on");
  trackView(!p.length?"accueil":{swipe:"swipe",sujets:"sujets",s:"sujet",candidats:"candidats",c:"candidat",m:"mesure",chercher:"chercher",parcours:"parcours",chat:"chat",hasard:"hasard"}[p[0]]||"autre");
  if(!p.length) vHome();
  else if(p[0]==="parcours") vParcours(p[1]);
  else if(p[0]==="chat") vChat(qs?new URLSearchParams(qs).get("m"):null);
  else if(p[0]==="hasard") vHasard();
  else if(p[0]==="swipe") vSwipe();
  else if(p[0]==="favoris") vFavoris();
  else if(p[0]==="sujets") vSujets();
  else if(p[0]==="s") vSujet(p[1],qs?new URLSearchParams(qs).get("p"):null);
  else if(p[0]==="candidats") vCandidats();
  else if(p[0]==="c") vCand(p[1]);
  else if(p[0]==="m") vMesure(p[1]);
  else if(p[0]==="chercher") vChercher(qs?new URLSearchParams(qs).get("q")||"":null);
  else vNotFound();
}
let last=location.hash;
window.addEventListener("hashchange",()=>{ POS[last]=scrollY; last=location.hash; HIST++; route(); window.scrollTo(0,POS[location.hash]||0); });
document.addEventListener("click",e=>{ const b=e.target.closest("[data-more]"); if(!b) return; const k=b.dataset.more, step=+b.dataset.step; EXP[k]=(EXP[k]||step)+(step===1?1e6:20); const y=scrollY; route(); window.scrollTo(0,y); });
window.addEventListener("scroll",()=>$("#top").classList.toggle("sc",scrollY>4),{passive:true});
route();
