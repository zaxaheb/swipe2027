  $("#app").innerHTML=`
    ${aide?`<div class="warn" style="margin:4px 0 8px;justify-content:space-between;align-items:center"><span>♥ ou glisse à droite si tu es <b>pour</b>, ✕ ou à gauche si tu es <b>contre</b>. Tes réponses restent sur ce téléphone et construisent ton profil.</span><button class="st-ico" id="sw-ok">OK</button></div>`:""}
    ${propCard(m,{hidden,id:"swc"})}
    <div style="display:flex;justify-content:space-between;gap:10px;margin-top:14px"><a class="src" href="#/m/${encodeURIComponent(m.id)}">Page de la mesure →</a><button class="src" id="sw-flag">Signaler une erreur</button></div>
    <div class="sw-btns"><button class="sm" id="sw-prev" aria-label="Mesure précédente"${SW.i?"":" disabled style=\"opacity:.4\""}>↶</button><button class="big" id="sw-no" aria-label="Contre">✕</button><button class="big yes" id="sw-yes" aria-label="Pour">${HEART(true)}</button><button class="sm" id="sw-pass" aria-label="Passer">→</button></div>
    <a class="bubble" href="#/chat?m=${encodeURIComponent(m.id)}" aria-label="Poser une question sur cette proposition"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></a>`;
  window.scrollTo(0,0); deskPanel(m);
  const answer=v=>{ setAns(m.id,v); if(hidden&&v!==0) toast((v===1?"♥ ":"✕ ")+"C'était "+C[m.P].cand+" ("+C[m.P].nom+")"); else flash(v); if(v===0) track("swipe:passe"); SW.i++; renderSwipe(1); };
  $("#sw-yes").onclick=()=>answer(1); $("#sw-no").onclick=()=>answer(-1); $("#sw-pass").onclick=()=>answer(0);
  $("#sw-prev").onclick=()=>{ if(SW.i>0){ SW.i--; renderSwipe(-1); } };
  if($("#sw-ok")) $("#sw-ok").onclick=()=>{ LS.set("swipe:aide",1); renderSwipe(0); };
  document.querySelectorAll("#app [data-reveal]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); SW.shown.add(m.id); renderSwipe(0); });
  $("#sw-flag").onclick=()=>openFlag(m);
  mountDive($("#app"));
  // Glisser la carte : elle suit le doigt, et part à droite (pour) ou à gauche (contre).
  const el=$("#swc");
  el.addEventListener("pointerdown",e=>{ if(e.target.closest("button,a")) return; SWD={el,x0:e.clientX,y0:e.clientY,dx:0,answer}; el.style.transition="none"; });
}
let SWD=null;   // carte en cours de glissement
addEventListener("pointermove",e=>{ if(!SWD) return; const d=SWD; d.dx=e.clientX-d.x0; if(Math.abs(d.dx)>Math.abs(e.clientY-d.y0)) d.el.style.transform=`translateX(${d.dx}px) rotate(${d.dx/22}deg)`; });
addEventListener("pointerup",()=>{ if(!SWD) return; const d=SWD; SWD=null; d.el.style.transition="";
  if(Math.abs(d.dx)>80){ d.el.style.transform=`translateX(${d.dx>0?600:-600}px) rotate(${d.dx>0?20:-20}deg)`; setTimeout(()=>d.answer(d.dx>0?1:-1),180); } else d.el.style.transform=""; });
document.addEventListener("keydown",e=>{ if(!SW||!location.hash.startsWith("#/swipe")) return; if(e.key==="ArrowRight") $("#sw-yes")?.click(); if(e.key==="ArrowLeft") $("#sw-no")?.click(); if(e.key==="ArrowDown") $("#sw-pass")?.click(); });

/* ---------- Mon profil ----------
   Calculé sur le téléphone à partir des réponses : accord par candidat et par sujet. Le portrait rédigé passe par l'API (mode « profil »), comme dans l'app d'origine. */
let AUTH_MODE="signup", PCAT="pour";
const EMAIL_DOMAIN="users.swipe2027.app", pseudoOf=u=>u&&u.email?u.email.split("@")[0]:"";
function accountBox(){
  if(!SB) return "";
  if(USER) return `<div class="box"><h3>Ton compte</h3><p style="margin:0 0 10px">Connecté en tant que <b>@${esc(pseudoOf(USER))}</b>. Tes réponses sont gardées sur tous tes appareils.</p>
    <div class="mini-actions" style="margin:0"><button class="btn" id="b-logout">Se déconnecter</button><button class="btn" id="b-del" style="color:var(--con)">Supprimer mon compte</button></div><p class="hint" id="del-st"></p></div>`;
  const su=AUTH_MODE==="signup";
  return `<div class="box"><h3>${su?"Garder mes réponses":"Connexion"}</h3><p style="margin:0 0 10px;font-size:14.5px;color:var(--ink2)">${su?"Un pseudo et un mot de passe pour retrouver tes réponses sur tous tes appareils. Pas d'email.":"Retrouve tes réponses."}</p>
    <form id="f-auth" style="display:grid;gap:8px"><input class="field" id="in-user" required minlength="3" maxlength="20" placeholder="Pseudo (évite ton vrai nom)" autocomplete="username" autocapitalize="none">
      <input class="field" id="in-pass" type="password" required minlength="8" placeholder="Mot de passe (8 caractères min.)" autocomplete="${su?"new-password":"current-password"}">
      ${su?`<label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2)"><input type="checkbox" id="in-consent" required style="margin-top:2px;width:18px;height:18px;flex:none"><span>J'accepte que mes réponses soient sauvegardées sous mon pseudo, sans email, nom ni adresse IP. Je peux tout effacer à tout moment. <a href="/confidentialite.html" target="_blank" style="text-decoration:underline">Confidentialité</a></span></label>`:""}
      <button class="btn dark">${su?"Créer mon compte":"Se connecter"}</button></form>
    <p class="hint" id="auth-st">${su?`Déjà un compte ? <button class="src" id="b-mode" style="margin:0">Se connecter</button>`:`Pas encore de compte ? <button class="src" id="b-mode" style="margin:0">En créer un</button>`}</p></div>`;
}
function bindAccount(){
  const md=$("#b-mode"); if(md) md.onclick=()=>{ AUTH_MODE=AUTH_MODE==="signup"?"login":"signup"; vProfil(); };
  const fm=$("#f-auth"); if(fm) fm.onsubmit=async e=>{ e.preventDefault(); const st=$("#auth-st");
    const user=$("#in-user").value.trim().toLowerCase(), pass=$("#in-pass").value, email=user+"@"+EMAIL_DOMAIN;
    if(!/^[a-z0-9_]{3,20}$/.test(user)){ st.textContent="Pseudo : 3 à 20 caractères, lettres, chiffres ou _."; return; }
    st.textContent="Un instant…";
    if(AUTH_MODE==="signup"){
      let r,d={}; try{ r=await fetch(API+"/compte",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pseudo:user,password:pass})}); d=await r.json().catch(()=>({})); }catch(e){ st.textContent="Pas de connexion au serveur."; return; }
      if(!r.ok){ st.textContent=d.error==="pris"?"Ce pseudo est déjà pris.":d.error==="mot_de_passe"?"Mot de passe trop faible : 8 caractères minimum.":d.error==="quota"?"Trop de comptes créés depuis ce réseau aujourd'hui.":"La création du compte n'est pas disponible ici ("+r.status+")."; return; }
      const {data,error}=await SB.auth.signInWithPassword({email,password:pass});
      if(error||!data.session){ st.textContent="Compte créé, mais la connexion a échoué : réessaie via « Se connecter »."; return; }
      USER=data.session.user; try{ await SB.from("profils").upsert({user_id:USER.id,consent_at:new Date().toISOString(),swipes:ANS,updated_at:new Date().toISOString()}); }catch(e){}
      track("compte:cree"); vProfil();
    } else { const {error}=await SB.auth.signInWithPassword({email,password:pass}); st.textContent=error?"Pseudo ou mot de passe incorrect.":"Connecté !"; } };
  const lo=$("#b-logout"); if(lo) lo.onclick=async()=>{ await SB.auth.signOut(); USER=null; vProfil(); };
  const dl=$("#b-del"); if(dl) dl.onclick=async()=>{ if(!confirm("Supprimer ton compte et toutes tes réponses enregistrées ? C'est définitif.")) return; const st=$("#del-st"); st.textContent="Suppression…";
    try{ const {data}=await SB.auth.getSession(); const r=await fetch(API+"/compte",{method:"DELETE",headers:{Authorization:"Bearer "+data.session.access_token}}); if(!r.ok) throw 0;
      await SB.auth.signOut().catch(()=>{}); USER=null; ANS={}; saveAns(); vProfil(); }catch(e){ st.textContent="La suppression a échoué. Réessaie plus tard."; } };
}
function vProfil(){
  backTop("Mon profil");
  const ids=Object.keys(ANS).filter(k=>MID[k]&&LIVE.has(MID[k].P));
  const pour=ids.filter(k=>ANS[k]===1), contre=ids.filter(k=>ANS[k]===-1), sans=ids.filter(k=>ANS[k]===0), nT=pour.length+contre.length;
  const sc=key=>{ const a=pour.filter(k=>key(MID[k])).length, b=contre.filter(k=>key(MID[k])).length; return {a,b,t:a+b,p:a+b?Math.round(100*a/(a+b)):null}; };
  const cands=CK.map(P=>({P,...sc(m=>m.P===P)})).filter(x=>x.t).sort((x,y)=>(y.t>=3)-(x.t>=3)||y.p-x.p||y.t-x.t);
  const subj=TH.map(t=>({t,...sc(m=>m.th===t.id)})).filter(x=>x.t>=2).sort((x,y)=>y.p-x.p||y.t-x.t);
  const bar=(name,x,color)=>`<div class="bar${x.t<3?" faible":""}"><span class="n">${esc(name)}</span><span class="t"><i style="width:${x.p}%;background:${color}"></i></span><span class="v">${x.p} %</span><small>${x.a} pour · ${x.b} contre${x.t<3?" · peu de réponses":""}</small></div>`;
  const CAT={pour:[pour,"Pour","badge-p"],contre:[contre,"Contre","badge-c"],sans:[sans,"Sans avis",""]};
  const [lst]=CAT[PCAT], PTR=LS.get("portrait:v2");
  $("#app").innerHTML=`
    <div class="stats"><div class="stat"><b>${ids.length}</b><span>réponses</span></div><div class="stat"><b style="color:var(--pro)">${pour.length}</b><span>pour</span></div><div class="stat"><b style="color:var(--con)">${contre.length}</b><span>contre</span></div></div>
    ${nT<5?`<div class="box"><h3>Ton profil</h3><p style="margin:0 0 10px">Réponds à au moins 5 mesures (pour ou contre) pour voir de quels candidats tu es le plus proche.</p><a class="btn dark" href="#/swipe">Swiper des mesures</a></div>`:`
    <div class="box"><h3>Ton accord avec chaque candidat</h3><div class="bars">${cands.map(x=>bar(C[x.P].cand,x,C[x.P].color)).join("")}</div>
      <p class="hint">% de mesures où tu es pour, parmi celles où tu as tranché. Les programmes n'ont pas la même taille : un score sur 1 ou 2 réponses dit peu de choses.</p></div>
    ${subj.length?`<div class="box"><h3>Par sujet</h3><div class="bars">${subj.map(x=>bar(x.t.t,x,(TCOL[x.t.id]||[])[1]||"var(--ink)")).join("")}</div></div>`:""}
    <div class="box"><h3>Ton portrait</h3><div id="pt-body">${PTR?portraitHTML(PTR.p):`<p style="margin:0;color:var(--ink2);font-size:14.5px">Une lecture neutre de tes réponses : ce que tu approuves, ce que tu rejettes, les candidats les plus proches.</p>`}</div>
      <button class="btn dark" id="b-pt" style="width:100%;margin-top:12px">${PTR?(nT>PTR.n?`Mettre à jour (${nT-PTR.n} nouvelles réponses)`:"Refaire l'analyse"):"Analyser mes réponses"}</button><p class="hint" id="pt-st"></p></div>`}
    ${accountBox()}
    ${ids.length?`<div class="box"><h3>Mes réponses</h3><div class="hs" style="margin-bottom:8px">${Object.entries(CAT).map(([k,c])=>`<a class="chip${PCAT===k?" on":""}" href="#" data-cat="${k}">${c[1]} <small>${c[0].length}</small></a>`).join("")}</div>
      ${lst.length?rowsWithMore(lst.slice().reverse().map(k=>MID[k]),10,true,"rep-"+PCAT):`<p class="hint">Aucune.</p>`}</div>`:""}
    ${favs().length?`<a class="box" href="#/favoris" style="display:flex;justify-content:space-between;align-items:center"><b>Mes mesures sauvegardées</b><span class="tag">${favs().length}</span></a>`:""}
    ${ids.length?`<button class="btn" id="b-reset" style="width:100%;margin-top:12px;color:var(--con)">Effacer toutes mes réponses</button>`:""}
    <p class="hint" style="text-align:center">Tes réponses restent sur ce téléphone${USER?" et dans ton compte":""}. <a href="/confidentialite.html" style="text-decoration:underline">Confidentialité</a></p>`;
  bindAccount();
  document.querySelectorAll("[data-cat]").forEach(a=>a.onclick=e=>{ e.preventDefault(); PCAT=a.dataset.cat; const y=scrollY; vProfil(); window.scrollTo(0,y); });
  const rs=$("#b-reset"); if(rs) rs.onclick=()=>{ if(!confirm("Effacer toutes tes réponses ?")) return; ANS={}; saveAns(); pushRemote(); SW=null; vProfil(); };
  const bp=$("#b-pt"); if(bp) bp.onclick=async()=>{ bp.disabled=true; bp.textContent="Analyse en cours…"; $("#pt-st").textContent="";
    try{ const r=await fetch(API+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"profil",choix:{pour,contre}})});
      if(!r.ok) throw Object.assign(new Error(),{st:r.status}); const d=await r.json(); if(!d.portrait) throw new Error();
      LS.set("portrait:v2",{p:d.portrait,n:nT,at:Date.now()}); track("profil:portrait"); vProfil(); }
    catch(e){ $("#pt-st").textContent=e.st===429?"Limite atteinte pour aujourd'hui, réessaie demain.":"L'analyse n'est pas disponible pour le moment"+(e.st===404||e.st===501?" (le serveur n'est pas lancé ici)":"")+"."; bp.disabled=false; bp.textContent="Réessayer"; } };
}
function portraitHTML(p){ if(!p) return ""; const t=x=>mdInline(esc(String(x||"")));
  const items=a=>`<ul>${a.map(x=>`<li><b>${esc(x.theme)}</b> : ${t(x.texte)}</li>`).join("")}</ul>`;
  const PR=(p.proches||[]).filter(c=>c.p>=50);
  return (p.en_un_mot?`<p class="pt-l">${t(p.en_un_mot)}</p>`:"")
    +(PR.length?`<div class="pt-s"><h4>Tes candidats les plus proches</h4><ul>${PR.map(c=>`<li><b>${esc(c.cand)}</b> · ${c.p} %${c.pourquoi?` : ${t(c.pourquoi)}`:""}</li>`).join("")}</ul></div>`:"")
    +((p.approuves||[]).length?`<div class="pt-s"><h4 style="color:var(--pro)">Ce que tu approuves</h4>${items(p.approuves)}</div>`:"")
    +((p.rejettes||[]).length?`<div class="pt-s"><h4 style="color:var(--con)">Ce que tu rejettes</h4>${items(p.rejettes)}</div>`:"")
    +((p.ressort||[]).length?`<div class="pt-s"><h4>Ce qui ressort</h4><ul>${p.ressort.map(x=>`<li>${t(x)}</li>`).join("")}</ul></div>`:""); }

function vHasard(){ const ps=CK.filter(P=>ML.some(m=>m.P===P&&F[m.id])); const P=ps[Math.floor(Math.random()*ps.length)];
  const l=ML.filter(m=>m.P===P&&F[m.id]); track("hasard"); location.replace("#/m/"+encodeURIComponent(l[Math.floor(Math.random()*l.length)].id)); }

function vFavoris(){
  backTop("Mes mesures sauvegardées");
  const l=favs().map(id=>MID[id]).filter(Boolean);
  $("#app").innerHTML=l.length?`<div style="margin-top:10px">${rowsWithMore(l,50,true,"fav")}</div><p class="hint">Gardées seulement sur ce téléphone.</p>`
    :`<div class="empty">Aucune mesure sauvegardée.<br>Touchez le cœur en haut d'une fiche pour la garder ici.</div>`;
}

function vNotFound(){ backTop("Introuvable"); $("#app").innerHTML=`<div class="empty">Cette page n'existe pas.<br><a href="#/" style="color:var(--accent);font-weight:600">Retour à l'accueil</a></div>`; }

/* ---------- routeur ---------- */
const POS={};
/* ===== v3 : sondages, agenda, actu, comparateur ===== */
const SD=(DATA.sondages||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
const POLL=SD.find(s=>s.complet)||SD[0];
const T1=new Date("2027-04-18T08:00:00+02:00");
const jLeft=()=>Math.max(0,Math.ceil((T1-Date.now())/864e5));
const JOURS=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const dLong=d=>{ const x=new Date(d+"T12:00:00"); return JOURS[x.getDay()]+" "+x.getDate()+" "+MOIS[x.getMonth()]+" "+x.getFullYear(); };
const pct=v=>String(v).replace(".",",")+" %";
const polCol=P=>(C[P]&&C[P].color)||"#888";
const pollRows=(s,n,big)=>{ const L=Object.entries(s.scores).sort((a,b)=>b[1]-a[1]).slice(0,n||99), mx=Math.max(...L.map(x=>x[1]));
  return L.map(([P,v])=>`<div class="pr${big?" big":""}"><span class="n">${esc(C[P]?(big?C[P].cand:lastName(C[P].cand)):P)}</span><span class="b"><i style="width:${100*v/mx}%;background:${polCol(P)}"></i></span><span class="v">${pct(v)}</span></div>`).join(""); };
const pollOf=P=>POLL&&POLL.scores[P]!=null?POLL.scores[P]:null;
const ACT={};
function actus(q){ q=q||""; if(!ACT[q]) ACT[q]=fetch(API+"/actus?q="+encodeURIComponent(q)).then(r=>r.ok?r.json():{items:[]}).then(j=>j.items||[]).catch(()=>[]); return ACT[q]; }
const ago=d=>{ if(!d) return ""; const h=Math.round((Date.now()-new Date(d))/36e5); return h<1?"à l'instant":h<24?"il y a "+h+" h":h<48?"hier":"il y a "+Math.round(h/24)+" j"; };
const nwRow=x=>`<a class="nw" href="${esc(x.url)}" target="_blank" rel="noopener"><b>${esc(x.t)}</b><small>${esc(x.src||host(x.url))} · ${ago(x.d)} ↗</small></a>`;
function fillActus(el,q,n){ if(!el) return; el.innerHTML=`<p class="disc" style="padding:10px 0">Chargement de l'actu…</p>`;
  actus(q).then(L=>{ if(!document.body.contains(el)) return; el.innerHTML=L.length?L.slice(0,n).map(nwRow).join(""):`<p class="disc" style="padding:10px 0">L'actu n'est pas disponible pour le moment.</p>`; }); }
function liveBlock(){
  return `<section class="live"><div class="cd"><b>J−${jLeft()}</b><span>avant le 1<sup>er</sup> tour<br><small>${dLong("2027-04-18")}</small></span></div>
    ${POLL?`<a class="poll" href="#/sondages"><div class="k">Dernier sondage · ${esc(POLL.institut)} · ${dateFr(POLL.date)}</div>${pollRows(POLL,4)}</a>`:""}</section>`;
}
function vSondages(){
  backTop("Sondages");
  const prev=SD.filter(s=>s!==POLL);
  $("#app").innerHTML=`<h1 class="ttl">Les sondages du 1<sup>er</sup> tour</h1>
    <p class="disc">Un sondage est une photo à un instant donné, pas une prévision. Chaque institut teste une liste de candidats différente : les chiffres ne se comparent pas toujours d'un sondage à l'autre.</p>
    ${POLL?`<section class="sec"><div class="sec-h"><h2>Dernier sondage complet</h2></div><div class="card-l" style="padding:12px 14px">
      <div style="font-weight:700">${esc(POLL.institut)}${POLL.pour?` <span style="font-weight:400;color:var(--muted)">pour ${esc(POLL.pour)}</span>`:""}</div>
      <div class="disc" style="margin:2px 0 10px">${POLL.terrain?"Terrain : "+esc(POLL.terrain):dLong(POLL.date)}${POLL.echantillon?" · "+esc(POLL.echantillon):""}${POLL.hypothese?" · hypothèse "+esc(POLL.hypothese):""}</div>
      ${pollRows(POLL,99,true)}<a class="src" href="${esc(POLL.url)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px">Source : ${esc(host(POLL.url))} ↗</a></div></section>`:""}
    ${prev.length?`<section class="sec"><div class="sec-h"><h2>Les sondages précédents</h2></div><div class="card-l">${prev.map(s=>`<a class="nw" href="${esc(s.url)}" target="_blank" rel="noopener"><b>${esc(s.institut)}${s.pour?" · "+esc(s.pour):""}</b><small>${dLong(s.date)} · ${Object.entries(s.scores).sort((a,b)=>b[1]-a[1]).map(([P,v])=>esc(C[P]?lastName(C[P].cand):P)+" "+pct(v)).join(", ")}${s.complet?"":" (premiers scores seulement)"} ↗</small></a>`).join("")}</div></section>`:""}
    <p class="disc" style="margin-top:14px">Les sondages sont repris avec leur source. Une erreur ? Écris-nous depuis la page Infos.</p>`;
}
function vActus(P){
  backTop("L'actu de la campagne");
  const main=CK.filter(k=>C[k].main);
  $("#app").innerHTML=`<div class="hs" style="margin-top:10px"><a class="chip${!P?" on":""}" href="#/actus">Tout</a>${main.map(k=>`<a class="chip${P===k?" on":""}" href="#/actus/${k}">${esc(lastName(C[k].cand))}</a>`).join("")}</div>
    <div class="card-l" id="act-l" style="margin-top:10px"></div>
    <p class="disc" style="margin-top:12px">Titres de presse des 14 derniers jours, via Google Actualités. Swipe 2027 ne choisit pas les articles : l'article se lit sur le site du média.</p>`;
  fillActus($("#act-l"),P&&C[P]?C[P].cand:"",20);
}
// Cours du chat mis en avant sur l'accueil (identifiants de TOPICS dans template.html)
const COURS=[["voter","Voter en 2027","🗳️"],["election","La présidentielle","🏛️"],["candidat","Devenir candidat","✍️"],["sondages","Les sondages","📊"],["dette","La dette publique","💶"],["retraites","Les retraites","⏳"],["institutions","Les institutions","⚖️"]];
function candHero(P){
  const c=C[P], age=c.ne?(new Date().getFullYear()-c.ne)+" ans":"", rank=POLL?Object.entries(POLL.scores).sort((a,b)=>b[1]-a[1]).findIndex(([k])=>k===P)+1:0;
  return `<div class="hero" style="background:${cgrad(P)}">${rank>0?`<span class="num">${String(rank).padStart(2,"0")}</span>`:""}<div class="ini">${initials(c.cand)}</div>
    <h2>${esc(c.cand)}</h2><p>${esc([c.role,age].filter(Boolean).join(" · ")||c.nom)}</p>
    <div class="pills"><span>${esc(c.nom)}</span>${pollOf(P)!=null?`<a href="#/sondages">${pct(pollOf(P))} · ${esc(POLL.institut)}</a>`:""}<a href="#/actus/${P}">Son actu</a></div></div>`;
}

function route(){
  const h=location.hash.replace(/^#/,"")||"/";
  const [path,qs]=h.split("?"); const p=path.split("/").filter(Boolean).map(decodeURIComponent);
  document.body.dataset.v=p[0]||"home";
  const nav=p[0]==="swipe"?"swipe":p[0]==="chat"?"chat":p[0]==="profil"?"profil":["explorer","sujets","s","candidats","c"].includes(p[0])?"explorer":"home";
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.n===nav));
  closeSheet(); if(!["chat","profil","info"].includes(p[0])&&!(p[0]==="explorer"&&p[1]==="condamnations")&&!(DESK.matches&&["m","swipe"].includes(p[0]))) v1Hide();
  if(p[0]!=="parcours") document.body.classList.remove("story-on");
  if(p[0]!=="swipe") document.body.classList.remove("sw-on");
  if(p[0]!=="chat") document.body.classList.remove("chat-on");
  trackView(!p.length?"accueil":{explorer:"explorer",swipe:"swipe",profil:"profil",sujets:"sujets",s:"sujet",candidats:"candidats",c:"candidat",m:"mesure",chercher:"chercher",parcours:"parcours",chat:"chat",hasard:"hasard"}[p[0]]||"autre");
  if(!p.length) vHome();
  else if(p[0]==="parcours") vParcours(p[1],qs&&new URLSearchParams(qs).get("new"));
  else if(p[0]==="chat") vChat(p.slice(1).join("/")||null,qs);
  else if(p[0]==="hasard") vHasard();
  else if(p[0]==="swipe") vSwipe();
  else if(p[0]==="favoris") vFavoris();
  else if(p[0]==="profil") vProfilV1();
  else if(p[0]==="info") vInfo();
  else if(p[0]==="explorer") vExplorer(p[1]);
  else if(p[0]==="sujets") vExplorer("sujets");
  else if(p[0]==="s") vSujet(p[1],qs?new URLSearchParams(qs).get("p"):null);
  else if(p[0]==="candidats") vExplorer("candidats");
  else if(p[0]==="c") vCand(p[1]);
  else if(p[0]==="m") vMesure(p[1]);
  else if(p[0]==="sondages") vSondages();
  else if(p[0]==="actus") vActus(p[1]);
  else if(p[0]==="chercher") vChercher(qs?new URLSearchParams(qs).get("q")||"":null);
  else vNotFound();
}
let last=location.hash;
window.addEventListener("hashchange",()=>{ POS[last]=scrollY; last=location.hash; HIST++; route(); window.scrollTo(0,POS[location.hash]||0); });
document.addEventListener("click",e=>{ const b=e.target.closest("[data-more]"); if(!b) return; const k=b.dataset.more, step=+b.dataset.step; EXP[k]=(EXP[k]||step)+(step===1?1e6:20); const y=scrollY; route(); window.scrollTo(0,y); });
window.addEventListener("scroll",()=>$("#top").classList.toggle("sc",scrollY>4),{passive:true});
route();
</script>
