<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swipe 2027 · les mesures des candidats</title>
<meta name="description" content="Ce que proposent les candidats à la présidentielle 2027, mesure par mesure : pourquoi c'est défendu, pourquoi c'est critiqué, avec les sources.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  /* Couleurs de l'app d'origine (Zak) : fond blanc, violet de marque, cœur rose, pour/contre vert/rouge */
  --bg:#ffffff; --card:#ffffff; --soft:#f4f2ef; --ink:#111111; --ink2:#3a3a3a; --muted:#6b6b6b; --line:#e8e6e2;
  --accent:#7a3cff; --accent-soft:#efe8ff; --like:#e8455f; --pro:#1e8f55; --pro-soft:#e4f4ea; --con:#d63d36; --con-soft:#fbe7e6; --ia:#a3670b; --ia-soft:#fff3dd;
  --serif:"Newsreader",Georgia,serif; --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --nav:62px; --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 36px)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--pad)}

/* barre du haut */
.top{position:sticky;top:0;z-index:20;background:rgba(250,249,247,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.top.sc{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:54px}
.back{width:38px;height:38px;margin-left:-8px;border-radius:50%;display:grid;place-items:center;flex:none}
.back:active{background:var(--soft)}
.top h1{font-size:16px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}

/* recherche */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px;margin:6px 0 4px}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;min-width:0;color:var(--ink)}
.search input::placeholder{color:#9a968f}
.search svg{flex:none;color:var(--muted)}
.clear{color:var(--muted);font-size:13px;font-weight:600;padding:6px}

/* sections */
.sec{margin:22px 0 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-h h2{font-size:13px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sec-h a,.sec-h button{font-size:14px;font-weight:600;color:var(--accent)}
.lead{font-size:15px;color:var(--ink2);margin:4px 0 0}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}

/* lignes de mesure */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:block;padding:13px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--soft)}
.who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:3px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.row .t{font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.meta:empty{display:none}
.tag{font-size:12px;font-weight:600;line-height:1;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.tag.con{background:var(--con-soft);color:var(--con)}
.tag.ia{background:var(--ia-soft);color:var(--ia)}
.tag.ok{background:var(--pro-soft);color:var(--pro)}
.more.sm{padding:4px 14px 12px;border-top:0;font-size:13.5px;margin-top:-6px}
.more{display:block;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line);font-size:14px;font-weight:600;color:var(--accent)}

/* tuiles sujets */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.tile:active{background:var(--soft)}
.tile b{font-size:15px;line-height:1.25;font-weight:600}
.tile span{font-size:12.5px;color:var(--muted);margin-top:6px}

/* tuiles de sujets */
.sqs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sq{border-radius:14px;padding:11px 12px 12px;display:flex;flex-direction:column;gap:3px;min-height:76px}
.sq:active{filter:brightness(.96)}
.sq b{font-size:14.5px;line-height:1.2;font-weight:700}
.sq span{font-size:12px;line-height:1.3;opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sq em{font-style:normal;font-size:11.5px;font-weight:700;margin-top:auto;padding-top:6px;opacity:.9}
/* grille de candidats */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:2px}
.cc:active{background:var(--soft)}
.cc b{font-size:15px;line-height:1.25}
.cc span{font-size:12.5px;color:var(--muted);line-height:1.3}
.cgrid{gap:8px}
.cmini{display:flex;flex-wrap:wrap;gap:8px}
.cmini a{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
/* raccourcis accueil */
.quick{display:flex;gap:8px;margin-top:10px}
.quick a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.quick a:active{background:var(--soft)}
.quick a.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.a a{color:var(--accent);text-decoration:underline}
.msg.err{background:var(--ia-soft);color:var(--ia);border-color:transparent}
.typing{align-self:flex-start;color:var(--muted);font-size:14px}
.composer{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));z-index:29;max-width:616px;margin:0 auto;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 16px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.composer input{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:none;min-width:0}
.composer button{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.composer button:disabled{opacity:.35}
body.chat-on{padding-bottom:calc(var(--nav) + 100px)}
.ctx{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.ctx b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:2px}
/* candidats */
.cands{display:flex;flex-direction:column}
.cand{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.cand:first-child{border-top:0}
.cand:active{background:var(--soft)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.cand .n{flex:1;min-width:0}
.cand .n b{display:block;font-size:15px;font-weight:600}
.cand .n span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#b5b1aa;flex:none}

/* défilement horizontal */
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--pad));padding:2px var(--pad) 4px}
.hs::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.avs{gap:4px}.avs a{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink2);text-align:center}
.avs .av{width:46px;height:46px;font-size:15px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip small{font-weight:500;opacity:.7}

/* blocs de candidat dans un sujet */
.cblock{margin-top:10px}
.cblock .list .row:first-child{border-top:0}
.ch{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-size:14px;font-weight:700}
.cblock[id^="pt-"] .ch{display:block;font-size:15px;line-height:1.3}
.ch a{display:flex;align-items:center;gap:8px}
.ch .c{font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
.absent{font-size:14px;color:var(--ink2);background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;margin-top:18px}
.absent b{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}

/* page mesure */
.m-top{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.m-top a{font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.m-q{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.28;letter-spacing:-.005em;margin:0}
.m-sous{margin:10px 0 0;padding-left:18px;font-size:14px;color:var(--ink2)}
.m-sous li{margin:3px 0}
.brief{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:16px}
.brief h3{font-size:12px;font-weight:700;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.brief p{margin:0;font-size:15.5px;line-height:1.5}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.fact b{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}
.fact span{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
a.fact{display:block}a.fact:active{background:var(--soft)}
.fact.wide{grid-column:1/-1}
.pc{display:grid;gap:8px;margin-top:10px}
.pc a{display:block;border-radius:12px;padding:10px 12px}
.pc .p{background:var(--pro-soft)}
.pc .c{background:var(--con-soft)}
.pc b{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.pc .p b{color:var(--pro)} .pc .c b{color:var(--con)}
.pc span{font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;color:var(--ia);background:var(--ia-soft);border-radius:12px;padding:9px 12px;margin-top:10px}

/* volets dépliables */
.acc{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details{border-top:1px solid var(--line)}
details:first-child{border-top:0}
summary{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:14px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .s{flex:1;min-width:0}
summary b{display:block;font-size:15.5px;font-weight:600}
summary span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
summary .cnt{font-size:12px;font-weight:700;background:var(--soft);border-radius:999px;padding:3px 8px;margin-left:6px;color:var(--ink2);vertical-align:1px}
summary svg{flex:none;margin-top:3px;color:#a8a49d;transition:transform .2s}
details[open] summary svg{transform:rotate(180deg)}
details[open] summary span{display:none}
.body{padding:0 14px 16px;font-size:15px;line-height:1.55;color:var(--ink2)}
.body p{margin:0 0 10px}
.body ul{margin:0;padding-left:18px}
.body li{margin:0 0 8px}
.q{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:0 0 14px}
.q.c{border-left-color:#e4a79e}
.q.p{border-left-color:#9fd1b4}
.q .h{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px}
.q .h i{font-style:normal;font-weight:500;color:var(--muted)}
.q .x{font-size:15px}
.src{display:inline-block;font-size:12.5px;color:var(--accent);font-weight:600;margin-top:3px;word-break:break-word}
.camps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.sim{display:block;padding:10px 0;border-top:1px solid var(--line)}
.sim:first-of-type{border-top:0}
.sim .who{margin-bottom:2px}
.sim .x{font-size:14.5px;color:var(--ink)}
.sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 4px}

/* en-tête fiche / candidat */
.tn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .dot{width:11px;height:11px}
.heart{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink2)}
.heart.on{color:#e0344f}
.heart:active{background:var(--soft)}
.m-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.m-tags a{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.mini-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini-actions .btn{height:42px;font-size:14px;gap:6px}
/* approfondir : onglets qui glissent de gauche à droite */
.dive-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 8px}
.dive-h h2{font-size:13px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dive-h span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--pad));padding:2px var(--pad) 10px;position:sticky;top:54px;z-index:10;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.st-card{overflow-x:hidden}
.st-card .tabs{top:-20px;background:var(--card);margin:0 -18px;padding:6px 18px 10px}
.st-card .swiper{margin:0 -18px;padding:0 18px;scroll-padding:0 18px}
.st-card .dive-h{margin-top:6px}
.tabs .chip{font-size:13.5px;padding:7px 12px}
.swiper{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1*var(--pad));padding:0 var(--pad);scroll-padding:0 var(--pad);transition:height .2s}
.swiper::-webkit-scrollbar{display:none}
.swiper.drag{user-select:none}
.panel{flex:0 0 100%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.panel .body{padding:14px 14px 16px}
.panel h3{font-size:16px;margin:0 0 10px}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .2s}
.dots i.on{background:var(--ink);width:16px;border-radius:3px}
/* page candidat */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.1;font-weight:700}
.stat span{font-size:12px;color:var(--muted);line-height:1.25;display:block;margin-top:2px}
button.stat{text-align:left}
button.stat.on{border-color:var(--ink);background:var(--soft)}
/* avis et profil */
.avis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.avis button{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600}
.avis button.on.p{background:var(--pro-soft);border-color:var(--pro);color:var(--pro)}
.avis button.on.c{background:var(--con-soft);border-color:var(--con);color:var(--con)}
.avis button.on.s{background:var(--soft);border-color:var(--ink2)}
.avis-l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.box h3{font-size:12px;font-weight:700;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:16px;background:var(--bg)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:13.5px}
.bar .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t{height:9px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:5px}
.bar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar.faible{opacity:.55}
.bar small{grid-column:2/4;font-size:11.5px;color:var(--muted);margin-top:-6px}
.pt-l{font-size:16px;line-height:1.5;margin:0 0 10px;font-family:var(--serif)}
.pt-s{margin-top:12px}.pt-s h4{font-size:13px;margin:0 0 4px}.pt-s ul{margin:0;padding-left:18px;font-size:14.5px}.pt-s li{margin:3px 0}
.badge-p{color:var(--pro);background:var(--pro-soft)}.badge-c{color:var(--con);background:var(--con-soft)}
.flash{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:60;font-size:22px;font-weight:800;padding:12px 22px;border-radius:999px;pointer-events:none;animation:fl .7s ease-out forwards}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-40%) scale(.9)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%)}}
.st-who .heart{margin-left:auto}
/* actions */
.actions{display:grid;gap:8px;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;font-weight:600;font-size:15px;background:var(--card);border:1px solid var(--line)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:active{opacity:.8}

/* feuille de signalement */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:18px 18px 0 0;padding:10px var(--pad) calc(16px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;transform:translateY(105%);transition:transform .25s}
.sheet:not(.on){visibility:hidden;transition:transform .25s,visibility 0s .25s}.sheet.on{transform:none}.sheet-bg.on{display:block}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;font-size:14px;font-weight:600}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.opt.on{border-color:var(--ink);background:var(--soft)}
textarea,.sheet input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;margin-top:10px;background:var(--bg)}
textarea{min-height:84px;resize:vertical}
.sent{font-size:14px;margin-top:10px}

/* navigation du bas */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;max-width:520px;margin:0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(0,0,0,.06);border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.06)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav);padding:0 6px;max-width:none}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:#8d8982;border-radius:999px;margin:6px 2px}
.nav a.on{color:var(--ink);background:var(--soft)}
.nav a.mid{color:#fff;background:var(--ink);margin:6px 4px}
.nav a.mid.on{background:var(--ink);color:#fff}
.sw-acc{border-radius:12px}
.sw-acc summary{padding:11px 12px}
.sw-acc summary b{font-size:14.5px}
.sw-acc .body{padding:0 12px 12px;font-size:14.5px}
.sw-acc .body h3{display:none}
/* parcours guidé (mode « stories ») */
body.story-on{padding-bottom:0}
body.story-on .top{display:none}
.story{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;max-width:640px;margin:0 auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.st-bar{display:flex;gap:3px;padding:calc(10px + env(safe-area-inset-top)) var(--pad) 0}
.st-bar i{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.st-bar i b{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform .25s}
.st-head{display:flex;align-items:center;gap:8px;padding:10px var(--pad) 6px}
.st-head .lab{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-ico{height:34px;min-width:34px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.st-ico.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.st-body{flex:1;min-height:0;padding:6px var(--pad) 0;display:flex}
.st-card{flex:1;min-height:0;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;animation:stin .22s ease-out}
.st-card.st-rev{animation-name:stback}
@keyframes stin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes stback{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.st-kick{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.st-q{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.2;margin:0}
.st-m{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.3;margin:0}
.st-who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.st-who .av{width:40px;height:40px;font-size:14px}
.st-who small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.st-blind{display:flex;align-items:center;gap:10px}
.st-blind .av{background:#9a968f}
.st-p{font-size:15px;line-height:1.5;color:var(--ink2);margin:0}
.st-avs{display:flex;flex-wrap:wrap;gap:6px}
.st-avs .av{width:34px;height:34px;font-size:12px}
.st-foot{display:flex;gap:8px;align-items:center;padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom))}
.st-foot .btn{flex:1;height:48px}
.st-foot .nb{flex:none;width:48px;padding:0}
.st-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:auto}
.st-rc{display:block;padding:10px 0;border-top:1px solid var(--line)}
.st-rc:first-of-type{border-top:0}
.st-rc .x{font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.path-card{display:block;background:var(--ink);color:#fff;border-radius:var(--r);padding:16px;margin-top:16px}
.path-card b{display:block;font-size:17px;margin-bottom:3px}
.path-card span{display:block;font-size:14px;opacity:.8}
.path-card .go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#fff;color:var(--ink);font-weight:700;font-size:14px;border-radius:999px;padding:8px 14px}
.empty{text-align:center;color:var(--muted);font-size:15px;padding:30px 10px}
.foot{font-size:12.5px;color:var(--muted);margin:26px 0 0;line-height:1.5}
.foot a{text-decoration:underline}
/* ---------- direction artistique de l'app d'origine ---------- */
.top{background:rgba(255,255,255,.95)}
.brand{font:700 26px/1 var(--sans);letter-spacing:-.03em;padding:calc(18px + env(safe-area-inset-top)) 0 8px}
.brand small{font-size:12.5px;letter-spacing:0;margin-top:4px}
.sec-h h2,.dive-h h2,.box h3,.brief h3{font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)}
.brief p{font:500 19px/1.4 var(--serif)}
.chip{background:#fff;border:1px solid var(--line);padding:8px 14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark{border-radius:999px}.btn{border-radius:999px}
.heart.on{color:var(--like)}
/* barre du bas : pilule noire, Swipe au centre en rose */
.nav{background:#000;border-color:#000;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.nav a{color:#8d8d8d}
.nav a.on{color:#fff;background:rgba(255,255,255,.12)}
.nav a.mid,.nav a.mid.on{background:var(--like);color:#fff}
/* sujets : dégradés et texte blanc, comme les sujets de l'app d'origine */
.sq{color:#fff!important;border-radius:16px;justify-content:flex-end;min-height:96px}
.sq b{font-size:15.5px;letter-spacing:-.01em}
.sq span,.sq em{opacity:.92}
/* la carte « photo » d'une mesure : dégradé du candidat, texte en serif blanc */
.photo{border-radius:16px;color:#fff;padding:18px 18px 22px;display:flex;flex-direction:column;gap:14px;min-height:220px;justify-content:space-between}
.photo .badges{display:flex;flex-wrap:wrap;gap:6px}
.photo .badges a,.photo .badges span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px)}
.photo .q{font:600 24px/1.22 var(--serif);letter-spacing:-.01em;margin:0}
.photo .q.l{font-size:20px}
.photo ul{margin:0;padding:0;list-style:none;font:500 15px/1.4 var(--serif);opacity:.92}
.photo ul li::before{content:"— ";opacity:.7}
.st-card .photo{margin:-20px -18px 0;border-radius:18px 18px 14px 14px;min-height:200px}
.st-card .photo .st-who{color:#fff}
.st-card .photo .st-who small{color:rgba(255,255,255,.8)}
.st-card .photo .heart{color:#fff;background:rgba(255,255,255,.18)}
.st-card .photo .heart.on{background:var(--like)}
.cc{border-left-width:5px}
/* ---------- retours de Zak (25/11) ---------- */
/* accueil : mesures du jour en carrousel */
.daily{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1*var(--pad));padding:2px var(--pad) 4px;scroll-padding:0 var(--pad)}
.daily::-webkit-scrollbar{display:none}
.daily .photo{flex:0 0 86%;scroll-snap-align:start;min-height:250px}
.daily .photo .who2{display:flex;align-items:center;gap:8px;font:700 14px var(--sans)}
.daily .photo .who2 small{font-weight:500;opacity:.85}
.daily .photo .meta2{font:600 12px var(--sans);opacity:.85}
.ask{display:block;background:var(--ink);color:#fff;border-radius:18px;padding:16px;margin-top:18px}
.ask b{display:block;font-size:17px}
.ask .in{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:999px;padding:11px 14px;margin-top:12px;font-size:15px;color:rgba(255,255,255,.75)}
.ask .sg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ask .sg span{font-size:12.5px;font-weight:600;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 10px}
.prog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
/* explorer : onglets segmentés */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);border-radius:999px;padding:4px;margin:calc(14px + env(safe-area-inset-top)) 0 4px}
.seg a{text-align:center;font-size:14px;font-weight:600;padding:8px 6px;border-radius:999px;color:var(--ink2)}
.seg a.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sq{position:relative}
.sq .st{position:absolute;top:9px;right:9px;font:700 11px var(--sans);background:rgba(255,255,255,.25);border-radius:999px;padding:3px 8px}
.sq .st.new{background:var(--like)}
/* candidats : tous au même rang, classés par nombre de propositions */
.crow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}.crow:active{background:var(--soft)}
.crow b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
.crow .nb{font-weight:700;font-variant-numeric:tabular-nums}
.crow .tr{grid-column:1/-1;height:7px;border-radius:4px;background:var(--soft);overflow:hidden}.crow .tr i{display:block;height:100%;border-radius:4px}
.crow small{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
/* condamnations */
.cbar{display:grid;grid-template-columns:110px 1fr 58px;gap:8px;align-items:center;font-size:13.5px;margin-top:9px}
.cbar .tr{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;display:flex}.cbar .tr i{display:block;height:100%}
.cbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
/* page sujet : points en accordéon */
.pts{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pts summary .mini{display:flex;gap:3px;margin-top:6px}.pts summary .mini i{width:9px;height:9px;border-radius:50%}
.pts details[open] summary .mini{display:none}
.pts .list{border:0;border-top:1px solid var(--line);border-radius:0}
.tag.new{background:var(--like);color:#fff}
.banner{display:flex;gap:12px;align-items:center;background:#fdeaee;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px}
.banner b{color:var(--like)}.banner .btn{height:36px;padding:0 14px;font-size:13.5px;flex:none;background:var(--like);color:#fff;border:0}
.row.isnew{background:#fff6f8}
/* swipe : grande carte, croix et cœur en bas */
body.sw-on{padding-bottom:calc(var(--nav) + 120px)}
.swc{border-radius:20px;min-height:min(56vh,430px);margin-top:4px;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .25s}
.swc .q{font-size:27px}.swc .q.l{font-size:22px}
.sw-btns{position:fixed;left:0;right:0;bottom:calc(var(--nav) + 22px + env(safe-area-inset-bottom));z-index:29;display:flex;justify-content:center;align-items:center;gap:18px;pointer-events:none}
.sw-btns button{pointer-events:auto;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.16);background:#fff;border:1px solid var(--line)}
.sw-btns .big{width:66px;height:66px;font-size:28px}
.sw-btns .yes{background:var(--like);color:#fff;border-color:var(--like)}
.sw-btns .sm{width:44px;height:44px;font-size:17px;color:var(--muted)}
.bubble{position:fixed;right:16px;bottom:calc(var(--nav) + 108px + env(safe-area-inset-bottom));z-index:29;width:50px;height:50px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.2)}
.sw-res{font:500 18px/1.45 var(--serif);margin:14px 2px 0;color:var(--ink)}
/* chat : mini-cours, conversations, quiz */
.topics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.topic{border-radius:14px;padding:11px 12px;color:#fff;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left}
.topic b{font-size:14.5px;line-height:1.2}.topic span{font-size:12px;opacity:.9;margin-top:3px}
.conv{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}.conv:first-child{border-top:0}
.conv .av{width:34px;height:34px;font-size:13px}.conv .n{flex:1;min-width:0}.conv .n b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conv .n span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:fixed;left:0;right:0;bottom:calc(var(--nav) + 78px + env(safe-area-inset-bottom));z-index:29;padding:0 14px;max-width:640px;margin:0 auto}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{font-size:13px;padding:7px 11px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
body.chat-on{padding-bottom:calc(var(--nav) + 150px)}
.quiz .qi{margin-top:12px}.quiz .qq{font-weight:700;font-size:14.5px}.quiz .op{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:6px;background:#fff;font-size:14px}
.quiz .op.ok{border-color:var(--pro);background:var(--pro-soft)}.quiz .op.ko{border-color:var(--con);background:var(--con-soft)}.quiz .ex{font-size:13px;color:var(--muted);margin-top:6px}
.msg.a h3,.msg.a h4{margin:6px 0 4px;font-size:15px}
.st-ico.back{font-size:14px}
.appframe{position:fixed;left:0;right:0;top:0;bottom:0;width:100%;height:100%;border:0;z-index:6;background:#fff}
body.frame-on .top{display:none}
.askm{background:var(--accent-soft);border-radius:16px;padding:14px;margin-top:16px}
.askm b{display:block;font-size:15.5px}.askm>span{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.askm .hs{margin-top:10px;margin-bottom:0}.askm .chip{font-size:13px;padding:7px 11px;border-color:transparent}
.askm .in{display:block;background:#fff;border-radius:999px;padding:10px 14px;margin-top:10px;color:var(--muted);font-size:15px}
.st-card .photo.swc{min-height:0}
.st-card .askm{margin-top:4px}
/* ---------- retours de Maxime (25/11) ---------- */
/* gris foncé à la place du noir, partout où il sert de fond */
:root{--dark:#44444c}
.nav{background:rgba(48,48,56,.8);border-color:rgba(255,255,255,.08);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 8px 24px rgba(0,0,0,.14)}
.nav a{color:#dcdce2}.nav a.on{color:#fff;background:rgba(255,255,255,.14)}
.chip.on,.btn.dark,.st-ico.on,.quick a.dark{background:var(--dark);border-color:var(--dark)}
.st-foot .btn.dark{background:#111;border-color:#111}
.composer button,.msg.u,.path-card{background:var(--dark)}
.dots i.on,.st-bar i b{background:var(--dark)}
/* accueil : plus compact, tient sur un écran */
.brand{font-size:23px;padding-bottom:4px}
.search{height:42px;margin-top:4px}
.sec{margin-top:18px}
.daily .photo{flex:0 0 80%;min-height:148px;padding:14px 15px 15px;gap:10px}
.daily .photo .q{font-size:18px;line-height:1.25}.daily .photo .q.l{font-size:16px}
.sqs .sq{min-height:82px}
.ask{display:block;background:var(--soft);border-radius:16px;padding:6px 6px 4px;margin-top:16px}
.ask .in{display:block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:15px;color:var(--muted)}
.ask .ex{display:block;font-size:13px;color:var(--muted);padding:6px 10px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask .ex span{color:var(--accent);font-weight:600}
.ask .ex span.fade{animation:askin .35s ease-out}
@keyframes askin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* swipe et carte d'une mesure : la carte colorée prend la place de son texte, pas plus */
.askm{padding:10px;margin-top:16px}
.askm .in{margin-top:0;background:#fff;border-radius:999px;padding:10px 14px;color:var(--ink2);font-weight:600;font-size:14.5px}
.askm .hs{margin-top:8px}
/* page candidat : parti dans l'en-tête, puis une carte d'identité toujours visible */
.tn small{font-size:13px;font-weight:600;color:var(--muted)}
.idc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:4px}
.idc-p{font-size:13.5px;color:var(--muted);line-height:1.35}.idc-p i{font-style:normal;color:var(--ink2);font-weight:600}
.idc-s{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px;font-size:13.5px;color:var(--muted)}.idc-s b{color:var(--ink)}
.idc-p+.idc-s{margin-top:8px}.idc-s:first-child{margin-top:0}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;line-height:1.2}
.pill.ok{background:var(--pro-soft);color:var(--pro)}.pill.wait{background:var(--ia-soft);color:var(--ia)}.pill.off{background:var(--con-soft);color:var(--con)}
.idc-r{border-top:1px solid var(--line);margin-top:11px;padding-top:10px}
.idc-r b{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.idc-r p{margin:0;font-size:14.5px;line-height:1.45;color:var(--ink2)}.idc-r p.mute{color:var(--muted)}
/* tuiles de sujet : la pastille « Exploré » prend sa place en haut, elle ne recouvre plus le titre */
.sq .st{position:static;align-self:flex-start;margin-bottom:auto;line-height:1.2}
.sq .st+b{margin-top:6px}
/* résumé sous la carte : un peu plus petit */
.sw-res{font-size:16px;line-height:1.45}
/* ---------- vue ordi (≥ 1100 px), comme l'app d'origine ---------- */
@media (min-width:1100px){
  body{padding-left:236px;padding-bottom:60px}
  body.panel-on{padding-right:min(440px,32vw)}
  .nav{left:0;top:0;bottom:0;right:auto;width:236px;max-width:none;margin:0;border-radius:0;background:#0b0b0c;border:0;box-shadow:none;padding:26px 14px;backdrop-filter:none;-webkit-backdrop-filter:none}
  .nav::before{content:"Swipe 2027";display:block;font:800 24px/1 var(--sans);letter-spacing:-.03em;color:#fff;padding:4px 12px 26px}
  .nav .wrap{display:flex;flex-direction:column;gap:4px;height:auto;padding:0;max-width:none}
  .nav a{flex-direction:row;justify-content:flex-start;gap:14px;padding:12px 14px;margin:0;font-size:15px;border-radius:12px;color:#8d8d8d}
  .nav a:hover{background:#18181a;color:#fff}
  .nav a.on{background:#232326;color:#fff}
  .nav a.mid,.nav a.mid.on{background:var(--like);color:#fff}
  .wrap{max-width:760px}
  .top .brand{display:none}
  .sqs{grid-template-columns:repeat(3,1fr)}
  .topics{grid-template-columns:repeat(3,1fr)}
  .daily .photo{flex-basis:47%}
  .appframe{left:236px;width:calc(100vw - 236px)}
  .appframe.panel{left:auto;right:0;width:min(440px,32vw);border-left:1px solid var(--line)}
  .sw-btns{left:236px}
  body.panel-on .sw-btns{right:min(440px,32vw)}
  .sw-btns{bottom:28px}
  body.panel-on .bubble{display:none}
  .bubble{bottom:30px!important}
  .sheet{left:236px}
  .story{left:236px;right:0}
}
/* ---------- retours du 26/11 ---------- */
.tiles-h{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1*var(--pad));padding:2px var(--pad) 4px;scroll-padding:0 var(--pad)}
.tiles-h::-webkit-scrollbar{display:none}
.tiles-h .sq{flex:0 0 42%;scroll-snap-align:start;min-height:96px}

// Une couleur douce par sujet (fond, texte).
const TCOL={salaires:["#fdf0d5","#8a5a00"],retraites:["#e8eefc","#2f4a9e"],impots:["#efe9fb","#5b3b9e"],travail:["#fde8e1","#a3412a"],economie:["#e6f0f7","#1f5a80"],agriculture:["#eef5df","#4d6b16"],ecologie:["#e2f4ea","#1e7a4c"],sante:["#fbe6ec","#a3264f"],ecole:["#fff3d6","#86620a"],logement:["#f3ece4","#7a5530"],securite:["#e9ecf1","#2e3a4f"],immigration:["#e4f3f3","#1b6b6b"],institutions:["#f1e8f3","#7a2f80"],europe:["#e6eefb","#1d4fa3"],societe:["#fceee3","#9a4d17"]};

const TK=new Map(ML.map(m=>[m.id,toksOf(m.t+" "+m.sous.join(" "))]));
const DF={}; for(const ts of TK.values()) for(const w of ts) DF[w]=(DF[w]||0)+1;
const IDF=w=>Math.log(ML.length/(DF[w]||1));
function simScore(a,b){ const A=new Set(TK.get(a.id)||[]); let s=0,n=0; for(const w of TK.get(b.id)||[]) if(A.has(w)){ s+=IDF(w); n++; } if(a.th===b.th) return n?s+2:0; return n>=2&&s>=9?s:0; }
// Pour chaque autre candidat : sa mesure la plus proche (même point), sinon rien.
function comparables(m){
  const same=[], seen=new Set([m.P]), pt=realPt(m);
  if(pt) for(const P of CK){ if(seen.has(P)) continue; const l=ML.filter(x=>x.P===P&&x.pt===pt); if(!l.length) continue;
    let best=l[0],bs=-1; for(const x of l){ const sc=simScore(m,x)+rank(x)/1e4; if(sc>bs){ bs=sc; best=x; } } same.push(best); seen.add(P); }
  const near=[];
  if(same.length<3) for(const P of CK){ if(seen.has(P)) continue; let best=null,bs=0;   // rapprochement par mots seulement si le point compte peu de candidats
    for(const x of ML){ if(x.P!==P) continue; const sc=simScore(m,x); if(sc>bs){ bs=sc; best=x; } }
    if(best&&bs>=(pt?10:6)) near.push([bs,best]); }
  const out=same.concat(near.sort((a,b)=>b[0]-a[0]).map(x=>x[1])); out.same=same.length; return out; }

/* ---------- mesure des parcours ----------

   Aucun identifiant, aucun cookie, rien d'enregistré sur le téléphone. Envoyé à /api/flux quand la page se ferme. */
const FX={t:{},e:{},vide:""}; let LASTV=null;
const track=e=>{ FX.e[e]=(FX.e[e]||0)+1; };
function trackView(v){ if(LASTV===v) return; if(LASTV){ const k=LASTV+">"+v; FX.t[k]=(FX.t[k]||0)+1; } else track("entree:"+v); LASTV=v; }
function flush(){ if(FX.vide){ track("recherche-vide:"+FX.vide); FX.vide=""; }
  if(!Object.keys(FX.t).length&&!Object.keys(FX.e).length) return;
  const body=JSON.stringify({t:FX.t,e:FX.e}); FX.t={}; FX.e={};
  try{ if(!navigator.sendBeacon||!navigator.sendBeacon(API+"/flux",new Blob([body],{type:"application/json"}))) fetch(API+"/flux",{method:"POST",headers:{"Content-Type":"application/json"},body,keepalive:true}).catch(()=>{}); }catch(e){} }
addEventListener("pagehide",flush); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); });

/* Carte d'identité d'un candidat : parti, état du programme, d'où viennent ses mesures, financement. Toujours visible, sans volet à déplier. */
function candCard(P,n,nf){
  const c=C[P], parts=(c.long||"").split(" · "), party=parts[0]!==c.nom?parts[0]:"";
  const prog=parts[1]&&parts[1]!==c.cand&&!/^propositions|^\(|vainqueur/i.test(parts[1])?parts[1]:"";
  // « Programme 2027 pas encore publié : positions recensées par… » → l'état va dans la pastille, le reste dans le texte
  let note=c.note||"", st=c.retrait?"Ne se présente plus":c.complet?"Programme complet publié":"Programme pas encore publié", noteL="Candidature";
  const m=note.match(/^(Programme[^:]{0,60}?)\s*:\s*(.+)$/);

    ${(c.sources||[]).length?`<div class="idc-r"><b>Sources de ses mesures</b><p class="mute">Chaque mesure est citée mot pour mot, avec son lien.</p>${c.sources.map(x=>`<a class="src" style="display:block;margin-top:6px" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.t)} ↗</a>`).join("")}</div>`:""}

/* Recherche : tous les mots doivent apparaître (début de mot) dans la mesure, sa section, le candidat ou le résumé de la fiche. */
const IDX=ML.map(m=>{ const f=F[m.id]; return {m, a:norm(m.t+" "+m.sous.join(" ")), b:norm(m.sec+" "+C[m.P].cand+" "+C[m.P].nom+" "+THM[m.th].t+" "+(realPt(m)?PT[m.pt].t:"")+" "+(f?f.resume||"":""))}; });
const SYN={retraite:["pension"],smic:["salaire minimum"],immigration:["immigr","etranger"],impot:["impots","fiscal","taxe"],ecole:["educat","eleve"],police:["securite"],climat:["ecolog"],chomage:["emploi"]};
function search(q){
  const toks=norm(q).split(/[^a-z0-9€%]+/).filter(w=>w.length>1);
  if(!toks.length) return [];
  const re=toks.map(w=>new RegExp("(^|[^a-z0-9])("+[w,...(SYN[w.replace(/s$/,"")]||[])].map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")"));
  const out=[];
  for(const x of IDX){ let s=0, ok=true;
    for(const r of re){ const ia=r.test(x.a), ib=r.test(x.b); if(!ia&&!ib){ ok=false; break; } s+=ia?3:1; }
    if(ok) out.push([s*100+rank(x.m)/20,x.m]); }
  return out.sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
}

/* « Pour aller plus loin » : onglets + volets qu'on fait glisser de gauche à droite. Même composant sur la fiche et dans le Swipe. */
const diveHTML=P=>`<div class="dive"><div class="dive-h"><h2>Pour aller plus loin</h2><span>Glisse →</span></div>
    <div class="tabs">${P.map((x,i)=>`<button class="chip${i?"":" on"}">${esc(x.label)}${x.cnt?` <small>${x.cnt}</small>`:""}</button>`).join("")}</div>

let DRAG=null;   // glisser à la souris (un seul à la fois)
addEventListener("pointermove",e=>{ if(!DRAG) return; const dx=e.clientX-DRAG.x; if(Math.abs(dx)>4){ DRAG.moved=true; e.preventDefault(); } DRAG.sw.scrollLeft=DRAG.left-dx; });
addEventListener("pointerup",()=>{ if(!DRAG) return; const d=DRAG; DRAG=null; d.sw.style.scrollSnapType=""; d.done(); });
function mountDive(root,opt){
  const dv=root.querySelector(".dive"); if(!dv) return;
  const sw=dv.querySelector(".swiper"), panels=[...sw.children], tabs=[...dv.querySelectorAll(".tabs .chip")], dots=[...dv.querySelectorAll(".dots i")];
  const step=()=>panels.length>1?panels[1].offsetLeft-panels[0].offsetLeft:1;
  let cur=-1;
  const setActive=i=>{ if(i===cur) return; cur=i; tabs.forEach((b,k)=>b.classList.toggle("on",k===i)); dots.forEach((d,k)=>d.classList.toggle("on",k===i));
    sw.style.height=panels[i].offsetHeight+"px"; tabs[i]&&tabs[i].scrollIntoView({inline:"nearest",block:"nearest"}); track("onglet:"+panels[i].dataset.k); };
  const goTab=(i,scroll)=>{ sw.scrollTo({left:i*step(),behavior:"smooth"});
    if(scroll){ const box=opt&&opt.scroller; if(box) box.scrollTo({top:dv.offsetTop-8,behavior:"smooth"}); else window.scrollTo({top:dv.getBoundingClientRect().top+scrollY-60,behavior:"smooth"}); } };
  let tm; sw.addEventListener("scroll",()=>{ clearTimeout(tm); tm=setTimeout(()=>setActive(Math.round(sw.scrollLeft/step())),60); },{passive:true});
  tabs.forEach((b,i)=>b.onclick=()=>goTab(i,false));
  let moved=false;
  sw.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse") return; moved=false; sw.style.scrollSnapType="none";
    DRAG={sw,x:e.clientX,left:sw.scrollLeft,get moved(){return moved;},set moved(v){moved=v;},done:()=>goTab(Math.max(0,Math.min(panels.length-1,Math.round(sw.scrollLeft/step()))),false)}; });
  sw.addEventListener("click",e=>{ if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; } },true);
  root.querySelectorAll("[data-tab]").forEach(a=>a.onclick=e=>{ e.preventDefault(); const i=panels.findIndex(p=>p.dataset.k===a.dataset.tab); if(i>=0) goTab(i,true); });
  setActive(0);
}

/* ---------- parcours guidé ----------
   Une étape = un point précis (« Âge de départ »). On fait défiler la position de chaque candidat sur ce point,
   puis un récapitulatif, puis la question suivante. Glisser = « suivant », jamais « j'aime ». */
const ptCands=pid=>CK.filter(P=>ML.some(m=>m.P===P&&m.pt===pid));
function pathSteps(sid){
  const pts=t=>(t.pts||[]).map(p=>p[0]).filter(pid=>!/-autres$/.test(pid));
  if(sid){ const t=THM[sid]; if(!t) return []; const st=pts(t).filter(pid=>ptCands(pid).length>=2).sort((a,b)=>ptCands(b).length-ptCands(a).length);

  return TH.map(t=>pts(t).map(pid=>[pid,ptCands(pid).length]).sort((a,b)=>b[1]-a[1])[0]).filter(x=>x&&x[1]>=4).map(x=>x[0]);

function shuffled(arr,seed){ const a=arr.slice(); let x=seed||1; for(let i=a.length-1;i>0;i--){ x=(x*9301+49297)%233280; const j=Math.floor(x/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  let t=String(txt||""); for(const n of names) t=t.replace(new RegExp("(^|[^\\p{L}])"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?=$|[^\\p{L}])","giu"),"$1[ce candidat]");

const restPool=pid=>{ const r=PT[pid]; return ML.filter(m=>m.th===r.th&&!r.cov.has(m.pt)); };
function storyCards(pid){
  if(pid.startsWith("rest:")){ const pool=restPool(pid), cs=shuffled(CK.filter(P=>pool.some(m=>m.P===P)),ST.seed+7);
    return cs.flatMap(P=>pool.filter(m=>m.P===P).sort(byRank).map(m=>({P,m,more:0}))); }
  const ok=m=>m.pt===pid&&(!ST.only||ST.only.has(m.id));

function newSteps(sid,only){ const t=THM[sid]; return (t&&t.pts||[]).map(p=>p[0]).filter(pid=>ML.some(m=>m.pt===pid&&only.has(m.id))); }

/* ---------- Swipe ----------
   Comme l'app d'origine : une grande carte, ✕ et ♥ en bas, la bulle pour en discuter. Glisser la carte à droite = pour, à gauche = contre.
   Dessous : le résumé, puis « Pour aller plus loin » en 3 volets (Concrètement, Pourquoi, Critiques résumées).
   Équilibré : les candidats passent à tour de rôle (ordre tiré au sort). Réponses sur le téléphone (et dans le compte si on en a un). */
let SW=null;
function swipeDeck(){
  const seed=()=>1+Math.floor(Math.random()*9999), todo=m=>!(m.id in ANS);
  const rr=pool=>{ const ps=shuffled(CK.filter(P=>pool.some(m=>m.P===P)),seed()); const per=Object.fromEntries(ps.map(P=>[P,shuffled(pool.filter(m=>m.P===P),seed())]));
    const out=[]; let more=true; while(more){ more=false; for(const P of ps){ const m=per[P].shift(); if(m){ out.push(m); more=true; } } } return out; };
  return rr(ML.filter(m=>F[m.id]&&todo(m))).concat(rr(ML.filter(m=>!F[m.id]&&todo(m))));
}
function vSwipe(){
  if(!SW||!SW.deck.length) SW={deck:swipeDeck(),i:0,blind:!!LS.get("swipe:blind"),shown:new Set()};
  track("swipe:debut"); document.body.classList.add("sw-on"); renderSwipe(0);
}
function swipePanels(m,f,hidden){
  if(!f) return hidden?[]:[dbPanelSpec(m)]; const lg=f.logique?(typeof f.logique==="string"?{texte:f.logique}:f.logique):null, crit=f.critiques||[], mk=h=>hidden?maskHtml(h,m.P):h, P=[];
  if((f.concret||[]).length) P.push({k:"concret",label:"Concrètement",html:mk(`<ul>${f.concret.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`)});
  if(lg) P.push({k:"pour",label:"Pourquoi",html:mk(`<p>${esc(lg.texte)}</p>`)});
  if(crit.length) P.push({k:"contre",label:"Critiques",cnt:crit.length,html:mk(crit.slice(0,5).map(x=>`<div class="q c"><div class="h">${esc(x.camp||x.qui||"")}</div><div class="x">${esc(firstSentence(x.texte))}</div></div>`).join(""))});
  if(!hidden) P.push(dbPanelSpec(m));
  return P;
}
function toast(t){ const d=document.createElement("div"); d.className="flash"; d.style.cssText="background:var(--dark);color:#fff;font-size:15px;top:22%;animation-duration:2.2s"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2300); }
function renderSwipe(dir){
  setTop(`<h1 style="font-size:18px">Swipe</h1><button class="chip${SW.blind?" on":""}" id="sw-blind" style="font-size:13px;padding:6px 11px">🙈 ${SW.blind?"Noms masqués":"Masquer les noms"}</button>`);
  $("#sw-blind").onclick=()=>{ SW.blind=!SW.blind; LS.set("swipe:blind",SW.blind); track("swipe:aveugle:"+(SW.blind?"on":"off")); renderSwipe(0); };
  if(SW.i>=SW.deck.length){ SW.deck=SW.deck.concat(swipeDeck()); if(SW.i>=SW.deck.length){ $("#app").innerHTML=`<div class="empty">Tu as répondu à toutes les mesures.<br><br><a class="btn dark" href="#/profil">Voir mon profil</a></div>`; return; } }
  const m=SW.deck[SW.i], f=F[m.id], th=THM[m.th], pt=realPt(m)?PT[m.pt].t:th.t;
  const hidden=SW.blind&&!SW.shown.has(m.id), mk=t=>hidden?maskName(t,m.P,true):t;
  const aide=!LS.get("swipe:aide"), P3=swipePanels(m,f,hidden);
  $("#app").innerHTML=`
    ${aide?`<div class="warn" style="margin:4px 0 8px;justify-content:space-between;align-items:center"><span>♥ ou glisse à droite si tu es <b>pour</b>, ✕ ou à gauche si tu es <b>contre</b>. Tes réponses restent sur ce téléphone et construisent ton profil.</span><button class="st-ico" id="sw-ok">OK</button></div>`:""}
    ${propCard(m,{hidden,id:"swc"})}
    <div style="display:flex;justify-content:space-between;gap:10px;margin-top:14px"><a class="src" href="#/m/${encodeURIComponent(m.id)}">Page de la mesure →</a><button class="src" id="sw-flag">Signaler une erreur</button></div>
    <div class="sw-btns"><button class="sm" id="sw-prev" aria-label="Mesure précédente"${SW.i?"":" disabled style=\"opacity:.4\""}>↶</button><button class="big" id="sw-no" aria-label="Contre">✕</button><button class="big yes" id="sw-yes" aria-label="Pour">${HEART(true)}</button><button class="sm" id="sw-pass" aria-label="Passer">→</button></div>
    <a class="bubble" href="#/chat?m=${encodeURIComponent(m.id)}" aria-label="Poser une question sur cette proposition"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></a>`;
  window.scrollTo(0,0); deskPanel(m);
  const answer=v=>{ setAns(m.id,v); if(hidden&&v!==0) toast((v===1?"♥ ":"✕ ")+"C'était "+C[m.P].cand+" ("+C[m.P].nom+")"); else flash(v); if(v===0) track("swipe:passe"); SW.i++; renderSwipe(1); };
  $("#sw-yes").onclick=()=>answer(1); $("#sw-no").onclick=()=>answer(-1); $("#sw-pass").onclick=()=>answer(0);
  $("#sw-prev").onclick=()=>{ if(SW.i>0){ SW.i--; renderSwipe(-1); } };
  if($("#sw-ok")) $("#sw-ok").onclick=()=>{ LS.set("swipe:aide",1); renderSwipe(0); };
  document.querySelectorAll("#app [data-reveal]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); SW.shown.add(m.id); renderSwipe(0); });
  $("#sw-flag").onclick=()=>openFlag(m);
  mountDive($("#app"));
  // Glisser la carte : elle suit le doigt, et part à droite (pour) ou à gauche (contre).
  const el=$("#swc");
  // Souris : événements « pointer ». Doigt : événements « touch », avec verrouillage du sens dès les premiers pixels :
  // si le geste part plutôt de côté, on bloque le défilement de la page et la carte suit le doigt ; s'il part vers le bas, on laisse défiler.
  el.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse"||e.target.closest("button,a")) return; SWD={el,x0:e.clientX,y0:e.clientY,dx:0,answer,lock:"x"}; el.style.transition="none"; });
  el.addEventListener("touchstart",e=>{ if(e.touches.length!==1||e.target.closest("button")) return; const t=e.touches[0]; SWD={el,x0:t.clientX,y0:t.clientY,dx:0,answer,lock:null,touch:true}; },{passive:true});
  el.addEventListener("touchmove",e=>{ const d=SWD; if(!d||!d.touch) return; const t=e.touches[0], dx=t.clientX-d.x0, dy=t.clientY-d.y0;
    if(!d.lock){ if(Math.abs(dx)<8&&Math.abs(dy)<8) return; d.lock=Math.abs(dx)>=Math.abs(dy)*0.75?"x":"y"; if(d.lock==="x") el.style.transition="none"; }
    if(d.lock==="y"){ SWD=null; return; }
    if(e.cancelable) e.preventDefault(); d.dx=dx; el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`; },{passive:false});
  el.addEventListener("touchend",()=>{ if(SWD&&SWD.touch) swEnd(); });
  el.addEventListener("touchcancel",()=>{ if(SWD&&SWD.touch){ SWD.dx=0; swEnd(); } });
}
// après un glissement parti d'un lien de la carte (parti, sujet), on n'ouvre pas ce lien
document.addEventListener("click",e=>{ if(window.SWJUST&&Date.now()-window.SWJUST<400&&e.target.closest("#swc")){ e.preventDefault(); e.stopPropagation(); } },true);
function swEnd(){ const d=SWD; SWD=null; if(!d) return; d.el.style.transition=""; if(d.lock==="x"&&Math.abs(d.dx)>10) window.SWJUST=Date.now();
  if(d.lock==="x"&&Math.abs(d.dx)>70){ d.el.style.transform=`translateX(${d.dx>0?600:-600}px) rotate(${d.dx>0?20:-20}deg)`; setTimeout(()=>d.answer(d.dx>0?1:-1),180); } else d.el.style.transform=""; }
let SWD=null;   // carte en cours de glissement
addEventListener("pointermove",e=>{ const d=SWD; if(!d||d.touch) return; d.dx=e.clientX-d.x0; d.el.style.transform=`translateX(${d.dx}px) rotate(${d.dx/22}deg)`; });
addEventListener("pointerup",()=>{ if(SWD&&!SWD.touch) swEnd(); });
addEventListener("pointercancel",()=>{ if(SWD&&!SWD.touch){ SWD.dx=0; swEnd(); } });
document.addEventListener("keydown",e=>{ if(!SW||!location.hash.startsWith("#/swipe")) return; if(e.key==="ArrowRight") $("#sw-yes")?.click(); if(e.key==="ArrowLeft") $("#sw-no")?.click(); if(e.key==="ArrowDown") $("#sw-pass")?.click(); });

/* Nouvelle discussion : une vraie page, avec les liens pré-remplis d'après l'endroit d'où l'on vient */
let DBNEW=null;
function vForumNouveau(qs){
  backTop("Nouvelle discussion");
  const q=new URLSearchParams(qs||"");
  if(!DBNEW||DBNEW.qs!==qs) DBNEW={qs,links:[...(q.get("th")?[["th",q.get("th")]]:[]),...(q.get("P")?[["P",q.get("P")]]:[]),...(q.get("m")&&MID[q.get("m")]?[["m",q.get("m")]]:[])]};
  const chip=([k,v],i)=>`<span class="dbtag ${k==="th"?"s":k==="P"?"c":"m"}">${k==="th"?"# "+esc(THM[v].t):k==="P"?`<i class="dot" style="background:${C[v].color}"></i>`+esc(C[v].cand):"📄 "+esc(MID[v].t.slice(0,50))+(MID[v].t.length>50?"…":"")}<button data-dbunlink="${i}" aria-label="Retirer">✕</button></span>`;
  $("#app").innerHTML=`<div class="dbnew">
    <label class="dblab" for="dbn-t">Titre</label><input id="dbn-t" maxlength="140" placeholder="Une question précise, ex. « Peines planchers : que disent les évaluations ? »">
    <label class="dblab" for="dbn-x">Ton message</label><textarea id="dbn-x" rows="7" placeholder="Explique ce que tu veux discuter : ce que tu as lu, ce qui te pose question, ce que changerait la mesure…"></textarea>
    <label class="dblab">Relier à <span class="hint" style="margin:0;font-weight:500">(facultatif : sujet, candidat ou mesure)</span></label>
    <div class="dbtags" id="dbn-l">${DBNEW.links.map(chip).join("")}</div>
    <div class="dbfind"><input id="dbn-q" placeholder="Chercher un sujet, un candidat ou une mesure…" autocomplete="off"><div id="dbn-s"></div></div>
    <label class="dblab" for="dbn-u">Source <span class="hint" style="margin:0;font-weight:500">(facultatif)</span></label><input id="dbn-u" type="url" placeholder="https://…">
    <div class="dbmsg" id="dbn-m"></div>
    <button class="btn dark" id="dbn-go" style="width:100%;margin-top:14px">Publier</button>
    <p class="hint" style="text-align:center">Ta discussion sera visible après relecture par l'équipe de modération · <a href="#" data-dbrules>Règles du forum</a> ${DBDEMO}</p></div>`;
  const qi=$("#dbn-q"), sg=$("#dbn-s");
  qi.oninput=()=>{ const s=dbNorm(qi.value.trim()); if(s.length<2){ sg.innerHTML=""; return; }
    const R=[...TH.filter(t=>dbNorm(t.t).includes(s)).slice(0,3).map(t=>["th",t.id,"# "+t.t]),...CK.filter(P=>dbNorm(C[P].cand).includes(s)).slice(0,3).map(P=>["P",P,"👤 "+C[P].cand]),...ML.filter(m=>dbNorm(m.t).includes(s)).slice(0,5).map(m=>["m",m.id,"📄 "+lastName(C[m.P].cand)+" · "+m.t])];
    sg.innerHTML=R.map(([k,v,l])=>`<button data-dblink="${k}|${esc(v)}">${esc(l.length>110?l.slice(0,108)+"…":l)}</button>`).join("")||`<p class="hint" style="padding:6px 10px">Aucun résultat.</p>`; };
  $("#dbn-go").onclick=()=>{
    const ti=$("#dbn-t").value.trim(), tx=$("#dbn-x").value, src=$("#dbn-u").value;
    if(ti.length<8){ $("#dbn-m").innerHTML=`<div class="dbwarn">Donne un titre à ta discussion (une question précise marche bien).</div>`; return; }
    dbSubmit(tx,src,$("#dbn-m"),()=>{ const L=dbMine(); L.unshift({id:"m"+Date.now(),ts:Date.now(),fil:true,titre:ti,texte:tx,u:USER?pseudoOf(USER):"toi",links:DBNEW.links}); LS.set("debat:mine",L.slice(0,30)); DBNEW=null; location.hash="#/forum"; });
  };

const dbNorm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function dbSubmit(tx,src,msgEl,done){
  if(!USER&&!LS.get("debat:essai")){
    msgEl.innerHTML=`<div class="dbwarn"><b>Il faut un compte pour publier.</b> Un pseudo suffit, sans e-mail. <div class="dbgo" style="margin-top:8px"><a class="btn dark" href="#/profil">Me connecter</a><button class="btn" data-dbtry>Continuer (démo)</button></div></div>`; return; }
  if(tx.trim().length<3){ msgEl.innerHTML=`<div class="dbwarn">Ton message est vide.</div>`; return; }
  msgEl.innerHTML="";
  // Téléphone : on ferme d'abord le clavier, puis on ouvre les règles une fois l'écran stabilisé.
  const ae=document.activeElement; if(ae&&ae.blur) ae.blur(); document.body.classList.remove("db-typing");
  setTimeout(()=>dbRulesThen(done), ae&&/TEXTAREA|INPUT/.test(ae.tagName)?280:0);
}
function dbRulesThen(done){
  // Au moment de publier : les règles, puis le message part en relecture. (Le contrôle de qualité se fait côté modération, jamais devant le lecteur.)
  dbSheet(`<h3>Avant de publier</h3><ol class="dbrules">${DB_REGLES.map(([a,b])=>`<li><b>${a}</b> ${b}</li>`).join("")}</ol>
    <p>Ton message sera visible par tous après relecture par l'équipe de modération.</p>
    <div class="actions" style="display:grid;gap:8px"><button class="btn dark" id="db-pub">Je respecte les règles, publier</button><button class="btn" id="db-back">Modifier mon message</button></div>`);
  $("#db-back").onclick=()=>closeSheet();
  $("#db-pub").onclick=()=>{ closeSheet(); track("forum:envoi"); done(); };
}
const DB_REGLES=[["On analyse, on ne milite pas.","Pas de « votez X » : explique ce que change une mesure, pour qui, et pourquoi."],["On donne ses sources quand on peut.","Un lien aide les autres à vérifier un fait ou un chiffre."],["On respecte les gens.","On critique des idées, jamais des personnes, ni les candidats, ni les autres membres."],["On reste sur le sujet.","Celui de la mesure ou de la discussion."],["Pas de données personnelles.","Ni les tiennes, ni celles des autres."]];
function dbSheet(h){ $("#sheet").innerHTML=`<div class="grab"></div>`+h; $("#sheet").classList.add("on"); $("#sheet-bg").classList.add("on"); }

  const sd=e.target.closest("[data-dbsend]");
  if(sd){ e.preventDefault(); const box=sd.closest(".dbbox"), tx=box.querySelector("textarea").value, src=box.querySelector("input").value;
    return dbSubmit(tx,src,box.querySelector(".dbmsg"),()=>{ const L=dbMine(); L.unshift({id:"m"+Date.now(),ts:Date.now(),cible:box.dataset.cible,parent:box.dataset.parent,texte:tx,u:USER?pseudoOf(USER):"toi"}); dbFollow(box.dataset.cible,true); LS.set("debat:mine",L.slice(0,30)); dbRefresh(box); }); }
  const lk=e.target.closest("[data-dblink]");
  if(lk){ e.preventDefault(); const [k,val]=lk.dataset.dblink.split("|"); if(!DBNEW.links.some(x=>x[0]===k&&x[1]===val)) DBNEW.links.push([k,val]); const keep={t:$("#dbn-t").value,x:$("#dbn-x").value,u:$("#dbn-u").value}; vForumNouveau(DBNEW.qs); $("#dbn-t").value=keep.t; $("#dbn-x").value=keep.x; $("#dbn-u").value=keep.u; $("#dbn-q").focus(); return; }
  const ul=e.target.closest("[data-dbunlink]");
  if(ul){ e.preventDefault(); DBNEW.links.splice(+ul.dataset.dbunlink,1); const keep={t:$("#dbn-t").value,x:$("#dbn-x").value,u:$("#dbn-u").value}; vForumNouveau(DBNEW.qs); $("#dbn-t").value=keep.t; $("#dbn-x").value=keep.x; $("#dbn-u").value=keep.u; return; }
  const s=e.target.closest("[data-dbsort]"); if(s){ e.preventDefault(); DBSORT=s.dataset.dbsort; return dbRefresh(s); }
  const t=e.target.closest("[data-dbtri]"); if(t){ e.preventDefault(); DBF.tri=t.dataset.dbtri; return dbRefresh(); }
  const ty=e.target.closest("[data-dbtype]"); if(ty){ e.preventDefault(); DBF.type=ty.dataset.dbtype; return dbRefresh(); }
  if(e.target.closest("[data-dbrules]")){ e.preventDefault(); return dbSheet(`<h3>Les règles du forum</h3><ol class="dbrules">${DB_REGLES.map(([a,b])=>`<li><b>${a}</b> ${b}</li>`).join("")}</ol><p>Chaque message est relu par l'équipe de modération avant d'être publié. Un message signalé plusieurs fois est masqué en attendant d'être revu.</p><div class="actions"><button class="btn dark" style="width:100%" onclick="closeSheet()">OK</button></div>`); }
  if(e.target.closest("[data-dbflag]")){ e.preventDefault(); dbSheet(`<h3>Signaler ce message</h3><div class="opts">${["Hors sujet","Irrespectueux","Fausse information","Données personnelles","Spam"].map(x=>`<button class="opt" onclick="closeSheet()">${x}</button>`).join("")}</div><p class="hint">Un message signalé plusieurs fois est masqué en attendant que l'équipe de modération le relise. (Démo : rien n'est envoyé.)</p>`); }

document.addEventListener("focusin",e=>{ const t=e.target.closest("[data-dbgrow]"); if(t){ t.closest(".dbbox").classList.add("open"); if(t.rows<4) t.rows=4; }

/* ---------- Suivre, notifications, « Mon activité » (démo) ---------- */
const dbNotifs=()=>LS.get("debat:notifs")||[], dbSuivis=()=>LS.get("debat:suivis")||[];
const dbShort=t=>t.length>60?t.slice(0,58)+"…":t;
const dbAgo=ts=>{ const s=Math.max(0,(Date.now()-ts)/1000); return s<60?"à l'instant":s<3600?"il y a "+Math.round(s/60)+" min":s<86400?"il y a "+Math.round(s/3600)+" h":"il y a "+Math.round(s/86400)+" j"; };
function dbLabel(c){ if(String(c).startsWith("fil:")){ const t=DB_TH.find(x=>"fil:"+x.id===c); return t?t.t:"une discussion"; } return MID[c]?MID[c].t:"une mesure"; }
const dbHref=c=>String(c).startsWith("fil:")?"#/forum/"+c.slice(4):"#/m/"+encodeURIComponent(c)+"?forum";
function dbFollow(c,on){ if(!c) return; const S=dbSuivis().filter(x=>x!==c); if(on){ S.unshift(c); const f=LS.get("debat:fts")||{}; if(!(c in f)){ f[c]=Date.now(); LS.set("debat:fts",f); } } LS.set("debat:suivis",S); }
const dbFollowBtn=c=>{ const on=dbSuivis().includes(c); return `<button class="dbfollow${on?" on":""}" data-dbfollow="${esc(c)}" title="${on?"Ne plus suivre":"Être prévenu des nouveaux messages"}">${on?"🔔 Suivi":"Suivre"}</button>`; };
function dbNotify(n){ const N=dbNotifs(); if(N.some(x=>x.id===n.id)) return; N.unshift({...n,ts:Date.now(),lu:false}); LS.set("debat:notifs",N.slice(0,50)); }
const dbUnread=()=>dbNotifs().filter(x=>!x.lu).length;
function dbSync(){
  const now=Date.now(), L=dbMine(); let ch=false;
  for(const x of L){ if(!x.ts) continue;
    if(now>x.ts+DB_PUB&&!x.pubN){ x.pubN=1; ch=true; dbNotify({id:"pub-"+x.id,ic:"✓",txt:x.fil?`Ta discussion « ${dbShort(x.titre)} » a été publiée`:`Ton message dans « ${dbShort(dbLabel(x.cible))} » a été publié`,href:x.fil?"#/forum/activite":dbHref(x.cible)}); }
    if(now>x.ts+DB_REP&&!x.repN&&!x.parent&&!x.fil){ x.repN=1; ch=true; dbNotify({id:"rep-"+x.id,ic:"↩",txt:`@nadia_k a répondu à ton message dans « ${dbShort(dbLabel(x.cible))} »`,href:dbHref(x.cible)}); } }
  if(ch) LS.set("debat:mine",L);
  const f=LS.get("debat:fts")||{}; let cf=false;
  for(const c of dbSuivis()){ if(f[c]&&now>f[c]+15000&&!dbMine().some(x=>x.cible===c)){ dbNotify({id:"new-"+c,ic:"💬",txt:`2 nouveaux messages dans « ${dbShort(dbLabel(c))} », que tu suis`,href:dbHref(c)}); f[c]=0; cf=true; } }
  if(cf) LS.set("debat:fts",f);
  dbBadge(); return ch;
}
function dbBadge(){ const n=dbUnread();
  document.querySelectorAll('.nav a[data-n="profil"]').forEach(a=>{ let b=a.querySelector(".dbbadge"); if(!n){ if(b) b.remove(); return; } if(!b){ b=document.createElement("span"); b.className="dbbadge"; a.appendChild(b); } b.textContent=n>9?"9+":n; });
  const fr=$("#v1"); try{ const d=fr&&fr.contentDocument, x=d&&d.getElementById("dbp-n"); if(x) x.textContent=n?plural(n,"nouvelle notification","nouvelles notifications"):"Aucune nouvelle notification"; }catch(e){} }
setInterval(()=>{ if(dbSync()&&/^#\/(forum|m\/)/.test(location.hash)&&!document.activeElement.closest?.(".dbbox,.dbnew")) dbRefreshSoft(); },3000);
function dbRefreshSoft(){ const pn=document.querySelector(".dbpanel"); if(pn){ pn.outerHTML=dbPanel(pn.dataset.mid); return; } if(/^#\/forum/.test(location.hash)){ const y=scrollY; route(); scrollTo(0,y); } }
const dbActLink=()=>{ const n=dbUnread(); return `<a class="dbact" href="#/forum/activite">🔔 Mon activité${n?` <span class="dbbadge in">${n}</span>`:""}</a>`; };

    <div class="sec-h" style="margin-top:18px"><h2>Notifications</h2>${N.some(x=>!x.lu)?`<a href="#" data-dbreadall>Tout marquer comme lu</a>`:""}</div>
    <div class="list">${N.map(x=>`<a class="dbnotif${x.lu?"":" new"}" href="${x.href}" data-dbread="${x.id}"><span class="ic">${x.ic||"•"}</span><span style="flex:1;min-width:0">${esc(x.txt)}<small>${dbAgo(x.ts)}</small></span></a>`).join("")||`<p class="dbempty" style="padding:12px 14px;margin:0">Rien pour l'instant. Tu seras prévenu ici quand on te répond, quand ton message est publié, et quand il y a du nouveau dans ce que tu suis.</p>`}</div>
    <div class="sec-h" style="margin-top:22px"><h2>Mes messages</h2></div>
    <div class="list">${M.map(x=>`<a class="dbrow" href="${x.fil?"#/forum":dbHref(x.cible)}"><div style="min-width:0;flex:1"><div class="dbkind">${x.fil?"Discussion":"Message"} · <span style="color:${dbIsPub(x)?"#1f8a5b":"#3a6fd8"}">${dbIsPub(x)?"Publié":"En attente de relecture"}</span></div>
      <div class="dbt dbclamp">${esc(x.titre||x.texte)}</div><div class="dbm">${x.fil?"":"dans « "+esc(dbShort(dbLabel(x.cible)))+" » · "}${x.ts?dbAgo(x.ts):""}${x.repN?" · 1 réponse":""}</div></div></a>`).join("")||`<p class="dbempty" style="padding:12px 14px;margin:0">Tu n'as encore rien publié.</p>`}</div>
    <div class="sec-h" style="margin-top:22px"><h2>Je suis</h2></div>

    <div class="sec-h" style="margin-top:22px"><h2>Me prévenir</h2></div>
    <div class="box">${[["rep","Quand on répond à mes messages"],["suivi","Quand il y a du nouveau dans ce que je suis"],["pub","Quand mon message est publié"],["push","Aussi par notification sur ce téléphone"]].map(([k,l])=>`<label class="dbpref"><input type="checkbox" data-dbpref="${k}"${P[k]?" checked":""}> ${l}</label>`).join("")}</div>`;
  // ouvrir la page vaut lecture : le badge disparaît, les nouveautés restent surlignées jusqu'à la prochaine visite

  const f=e.target.closest("[data-dbfollow]"); if(f){ e.preventDefault(); e.stopPropagation(); const c=f.dataset.dbfollow; dbFollow(c,!dbSuivis().includes(c)); f.outerHTML=dbFollowBtn(c); return; }
  if(e.target.closest("[data-dbreadall]")){ e.preventDefault(); LS.set("debat:notifs",dbNotifs().map(x=>({...x,lu:true}))); dbBadge(); return dbRefresh(); }
},true);
document.addEventListener("change",e=>{ const k=e.target.dataset&&e.target.dataset.dbpref; if(!k) return; const P=LS.get("debat:prefs")||{rep:1,suivi:1,pub:1,push:0}; P[k]=e.target.checked?1:0; LS.set("debat:prefs",P); });
addEventListener("load",()=>setTimeout(dbSync,500));

function route(){
  const h=location.hash.replace(/^#/,"")||"/";
  const [path,qs]=h.split("?"); const p=path.split("/").filter(Boolean).map(decodeURIComponent);
  document.body.dataset.v=p[0]||"home";
  const nav=p[0]==="forum"?"forum":p[0]==="swipe"?"swipe":p[0]==="chat"?"chat":p[0]==="profil"?"profil":p[0]==="info"?"info":["explorer","sujets","s","candidats","c"].includes(p[0])?"explorer":"home";
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.n===nav||(nav==="forum"&&!DESK.matches&&a.dataset.n==="explorer")));
  closeSheet(); if(!["chat","profil","info"].includes(p[0])&&!(p[0]==="explorer"&&p[1]==="condamnations")&&!(DESK.matches&&["m","swipe"].includes(p[0]))) v1Hide();
  if(p[0]!=="parcours") document.body.classList.remove("story-on");
  if(p[0]!=="swipe") document.body.classList.remove("sw-on");
  if(p[0]!=="chat") document.body.classList.remove("chat-on");
  trackView(!p.length?"accueil":{explorer:"explorer",swipe:"swipe",profil:"profil",sujets:"sujets",s:"sujet",candidats:"candidats",c:"candidat",m:"mesure",chercher:"chercher",parcours:"parcours",chat:"chat",hasard:"hasard"}[p[0]]||"autre");
  if(!p.length) vHome();
  else if(p[0]==="parcours") vParcours(p[1],qs&&new URLSearchParams(qs).get("new"));
  else if(p[0]==="chat") vChat(p.slice(1).join("/")||null,qs);
  else if(p[0]==="hasard") vHasard();
  else if(p[0]==="swipe") vSwipe();
  else if(p[0]==="favoris") vFavoris();
  else if(p[0]==="profil") vProfilV1();
  else if(p[0]==="info") vInfo();
  else if(p[0]==="explorer") vExplorer(p[1]);
  else if(p[0]==="sujets") vExplorer("sujets");
  else if(p[0]==="s") vSujet(p[1],qs?new URLSearchParams(qs).get("p"):null);
  else if(p[0]==="candidats") vExplorer("candidats");
  else if(p[0]==="c") vCand(p[1]);
  else if(p[0]==="m") vMesure(p[1]);
  else if(p[0]==="forum") p[1]==="nouveau"?vForumNouveau(qs||""):p[1]==="activite"?vForumActivite():p[1]?vForumFil(p[1]):vExplorer("forum");
  else if(p[0]==="sondages") vSondages();
  else if(p[0]==="actus") vActus(p[1]);
  else if(p[0]==="chercher") vChercher(qs?new URLSearchParams(qs).get("q")||"":null);
  else vNotFound();
}
let last=location.hash;
let INFO_FROM="#/", CHAT_FROM="#/";
window.addEventListener("hashchange",()=>{ POS[last]=scrollY; if(location.hash.startsWith("#/info")&&!last.startsWith("#/info")) INFO_FROM=last||"#/"; if(location.hash.startsWith("#/chat")&&!last.startsWith("#/chat")) CHAT_FROM=last||"#/"; last=location.hash; HIST++; route(); window.scrollTo(0,POS[location.hash]||0); });
document.addEventListener("click",e=>{ const b=e.target.closest("[data-more]"); if(!b) return; const k=b.dataset.more, step=+b.dataset.step; EXP[k]=(EXP[k]||step)+(step===1?1e6:20); const y=scrollY; route(); window.scrollTo(0,y); });
window.addEventListener("scroll",()=>$("#top").classList.toggle("sc",scrollY>4),{passive:true});
route();
</script>
